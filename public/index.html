      const topicOpts = [
        ['', 'All topics'],
        ...(a.topics || []).map((t) => [t.id, t.title || t.id])
      ];
      return `
        <section class="admin-section">
          <h2>Users &amp; admins</h2>
          <p class="hint">Everyone who has signed in with Google. Check Admin to grant edit access and the Admin tab.</p>
          ${a.usersStatus && (a.users || []).length ? `<p class="admin-search-status">${escapeHtml(a.usersStatus)}</p>` : ''}
          ${renderAdminUsers()}
        </section>

        <section class="admin-section">
          <h2>Question search</h2>
          <p class="hint">Enter filters, then tap Search. Results stay hidden until you search. Tap a result to open it in Study.</p>
          <div class="admin-filters">
            <label for="adminSearchQ">Question contains</label>
            <input id="adminSearchQ" type="search" value="${escapeHtml(a.q)}" placeholder="e.g. stall, METAR, aspect ratio" autocomplete="off" />
            <label for="adminSearchTrack">Course</label>
            <select id="adminSearchTrack">
              ${courseOpts.map(([id, label]) =>
                `<option value="${escapeHtml(id)}" ${a.track === id ? 'selected' : ''}>${escapeHtml(label)}</option>`
              ).join('')}
            </select>
            <label for="adminSearchTopic">Topic</label>
            <select id="adminSearchTopic" ${a.track ? '' : 'disabled'}>
              ${topicOpts.map(([id, label]) =>
                `<option value="${escapeHtml(id)}" ${a.topic === id ? 'selected' : ''}>${escapeHtml(label)}</option>`
              ).join('')}
            </select>
            <label class="admin-check">
              <input id="adminHasFigure" type="checkbox" ${a.hasFigure ? 'checked' : ''} />
              Only questions with figures
            </label>
            <div class="btn-row">
              <button type="button" id="adminSearchBtn">Search</button>
            </div>
          </div>
          <p class="admin-search-status">${escapeHtml(a.status || '')}</p>
          ${renderAdminSearchResults()}
        </section>

        <section class="admin-section">
          <h2>Due schedule</h2>
          <p class="hint">
            How long until a card becomes Due again after each grade.
            <strong>Not due</strong> (Easy default) keeps the card out of the Due list.
          </p>
          ${['again', 'hard', 'good', 'easy'].map((grade) => {
            const rule = a.schedule?.[grade] || { value: 0, unit: 'days' };
            const never = rule.unit === 'never';
            const label = grade[0].toUpperCase() + grade.slice(1);
            return `
              <div class="schedule-row" data-schedule-grade="${grade}">
                <div class="grade-name">${label}</div>
                <input type="number" min="0" step="1" data-schedule-value
                  value="${never ? '' : escapeHtml(String(rule.value ?? 0))}"
                  placeholder="0" ${never ? 'disabled' : ''} />
                <select data-schedule-unit>
                  <option value="minutes" ${rule.unit === 'minutes' ? 'selected' : ''}>Minutes</option>
                  <option value="hours" ${rule.unit === 'hours' ? 'selected' : ''}>Hours</option>
                  <option value="days" ${rule.unit === 'days' ? 'selected' : ''}>Days</option>
                  <option value="never" ${never ? 'selected' : ''}>Not due</option>
                </select>
              </div>`;
          }).join('')}
          <div class="btn-row">
            <button type="button" class="secondary" id="resetScheduleBtn">Reset defaults</button>
            <button type="button" id="saveScheduleBtn">Save schedule</button>
          </div>
        </section>

        <section class="admin-section">
          <h2>Import deck</h2>
          <p class="hint">
            Upload CSV (<code>question,answer</code> or <code>topic,question,answer</code>) or paste JSON cards.
            Prefer course <strong>cfi_g</strong> or <strong>private</strong> for written banks.
          </p>
          <label>Course</label>
          <select id="importTrack">
            <option value="cfi_g">CFI-G</option>
            <option value="private">Private</option>
            <option value="commercial">Commercial</option>
            <option value="common">Common</option>
            <option value="aircraft_233">Schweizer 2-33</option>
          </select>
          <label>Topic title</label>
          <input id="importTopic" placeholder="e.g. FOI — Levels of learning" />
          <label>Import password (if configured on Railway)</label>
          <input id="importPassword" type="password" placeholder="GLIDER_IMPORT_PASSWORD" autocomplete="off" />
          <label>CSV</label>
          <textarea id="importCsv" rows="8" placeholder="topic,question,answer&#10;FOI,What are the four levels of learning?,Rote Understanding Application Correlation"></textarea>
          <div class="btn-row">
            <button type="button" id="importBtn">Import deck</button>
          </div>
          <h2 style="font-size:1rem;margin:18px 0 8px">Recent imports</h2>
          ${(state.imports || []).length ? state.imports.map((imp) => `
            <div class="track"><div class="badge">${trackLabel(imp.track_id)}</div>
              <div><h2 style="font-size:0.95rem">${escapeHtml(imp.filename || 'upload')}</h2>
              <p>${imp.card_count} cards · ${escapeHtml(imp.created_at || '')}</p></div></div>
          `).join('') : '<div class="empty">No imports yet</div>'}
        </section>
      `;
    }

    async function loadAdminTopics() {
      const track = state.admin.track;
      if (!track) {
        state.admin.topics = [];
        state.admin.topic = '';
        return;
      }
      const data = await api('/api/topics?track=' + encodeURIComponent(track));
      state.admin.topics = data.topics || [];
      if (state.admin.topic && !state.admin.topics.some((t) => t.id === state.admin.topic)) {
        state.admin.topic = '';
      }
    }

    async function runAdminSearch() {
      const q = new URLSearchParams({ limit: '150' });
      if (state.admin.q.trim()) q.set('q', state.admin.q.trim());
      if (state.admin.track) q.set('track', state.admin.track);
      if (state.admin.topic) q.set('topic', state.admin.topic);
      if (state.admin.hasFigure) q.set('has_figure', '1');
      state.admin.searched = true;
      state.admin.status = 'Searching…';
      if (state.view === 'admin') render();
      try {
        const data = await api('/api/cards?' + q.toString());
        state.admin.results = data.cards || [];
        const n = state.admin.results.length;
        state.admin.status = n
          ? `${n} question${n === 1 ? '' : 's'}${n >= 150 ? ' (showing first 150)' : ''}`
          : 'No matching questions.';
      } catch (err) {
        state.admin.results = [];
        state.admin.status = err.message || 'Search failed';
      }
      if (state.view === 'admin') render();
    }

    async function loadAdminUsers() {
      state.admin.usersStatus = 'Loading users…';
      try {
        const data = await api('/api/admin/users');
        state.admin.users = data.users || [];
        const n = state.admin.users.length;
        state.admin.usersStatus = n
          ? `${n} signed-in user${n === 1 ? '' : 's'}`
          : 'No signed-in users yet.';
      } catch (err) {
        state.admin.users = [];
        state.admin.usersStatus = err.message || 'Failed to load users';
      }
    }

    async function setUserAdminFlag(googleSub, isAdmin) {
      const data = await api('/api/admin/users/' + encodeURIComponent(googleSub), {
        method: 'PATCH',
        body: JSON.stringify({ is_admin: isAdmin })
      });
      const next = data.user;
      state.admin.users = (state.admin.users || []).map((u) =>
        u.google_sub === next.google_sub ? { ...u, ...next } : u
      );
      if (state.user?.sub === next.google_sub) {
        state.user = { ...state.user, isAdmin: Boolean(next.is_admin) };
        state.isAdmin = Boolean(next.is_admin);
      }
      render();
    }

    function readScheduleFromDom() {
      const schedule = {};
      app.querySelectorAll('[data-schedule-grade]').forEach((row) => {
        const grade = row.dataset.scheduleGrade;
        const unit = row.querySelector('[data-schedule-unit]')?.value || 'days';
        if (unit === 'never') {
          schedule[grade] = { value: 0, unit: 'never' };
          return;
        }
        const value = Number(row.querySelector('[data-schedule-value]')?.value);
        schedule[grade] = {
          value: Number.isFinite(value) && value >= 0 ? Math.floor(value) : 0,
          unit
        };
      });
      return schedule;
    }

    async function loadAdmin() {
      if (!isAdminUser()) {
        state.view = 'home';
        await loadHome();
        return;
      }
      if (!(state.tracks || []).length) {
        const tracks = await api('/api/courses').catch(() => api('/api/tracks'));
        state.tracks = tracks.courses || tracks.tracks || [];
      }
      await loadAdminTopics();
      await loadAdminUsers();
      try {
        const sched = await api('/api/study-schedule');
        if (sched?.schedule) state.admin.schedule = sched.schedule;
      } catch {
        /* keep defaults */
      }
      try {
        state.imports = (await api('/api/imports')).imports;
      } catch (err) {
        state.imports = [];
      }
      if (!state.admin.searched) {
        state.admin.results = [];
        state.admin.status = 'Enter filters and tap Search.';
      }
      render();
    }

    function render() {
      setNav();
      const sub = document.getElementById('subtitle');
      if (state.view === 'home') sub.textContent = 'Courses · daily league';
      if (state.view === 'study') sub.textContent = `Course ${trackLabel(state.study.track)} · ${state.study.cards.length} in session`;
      if (state.view === 'aircraft') {
        sub.textContent = state.aircraft.page === 'sgs233'
          ? 'SGS 2-33 · MacCready + wind'
          : 'Aircraft performance';
      }
      if (state.view === 'progress') sub.textContent = 'League · questions answered by day';
      if (state.view === 'admin') sub.textContent = 'Admin · search & import';

      if (state.view === 'home') app.innerHTML = renderHome();
      else if (state.view === 'study') app.innerHTML = renderStudy();
      else if (state.view === 'aircraft') {
        app.innerHTML = state.aircraft.page === 'sgs233' ? renderAircraft233() : renderAircraftHub();
      }
      else if (state.view === 'progress') app.innerHTML = renderProgress();
      else if (state.view === 'admin') app.innerHTML = renderAdmin();

      bind();
    }

    function bind() {
      app.querySelectorAll('[data-open-study]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await openStudy({
            track: btn.dataset.openStudy,
            topic: '',
            grades: []
          });
        });
      });
      app.querySelectorAll('[data-open-grade-study]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const g = btn.dataset.filterGrade;
          if (!g) return;
          await openStudy({
            track: btn.dataset.openGradeStudy,
            topic: '',
            mode: 'all',
            grades: [g]
          });
        });
      });
      app.querySelectorAll('[data-view-jump]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.view = btn.dataset.viewJump;
          render();
        });
      });
      app.querySelectorAll('[data-aircraft-page]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.view = 'aircraft';
          state.aircraft.page = btn.dataset.aircraftPage;
          render();
        });
      });
      app.querySelectorAll('[data-polar-config]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.aircraft.config = btn.dataset.polarConfig;
          render();
        });
      });
      const polarMc = app.querySelector('#polarMc');
      if (polarMc) {
        polarMc.addEventListener('input', () => {
          state.aircraft.macCready = Number(polarMc.value);
          updatePolarLive();
        });
      }
      const polarWind = app.querySelector('#polarWind');
      if (polarWind) {
        polarWind.addEventListener('input', () => {
          state.aircraft.wind = Number(polarWind.value);
          updatePolarLive();
        });
      }
      app.querySelectorAll('[data-set-track]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.study.track = btn.dataset.setTrack;
          state.study.topic = '';
          state.topics = (await api('/api/topics?track=' + encodeURIComponent(state.study.track))).topics;
          await loadStudyDeck();
        });
      });
      app.querySelectorAll('[data-set-mode]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.study.mode = btn.dataset.setMode;
          await loadStudyDeck();
        });
      });
      app.querySelectorAll('[data-set-limit]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.study.limit = Number(btn.dataset.setLimit) || 20;
          await loadStudyDeck();
        });
      });
      app.querySelectorAll('[data-toggle-grade]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const g = btn.dataset.toggleGrade;
          const set = new Set(state.study.grades || []);
          if (set.has(g)) set.delete(g);
          else set.add(g);
          state.study.grades = ['again', 'hard', 'good', 'easy'].filter((x) => set.has(x));
          await loadStudyDeck();
        });
      });
      const topicSelect = app.querySelector('#topicSelect');
      if (topicSelect) {
        topicSelect.addEventListener('change', async () => {
          state.study.topic = topicSelect.value;
          await loadStudyDeck();
        });
      }
      const toggleEdit = app.querySelector('#toggleEditBtn');
      if (toggleEdit) {
        toggleEdit.addEventListener('click', () => {
          if (state.study.editing) cancelEditCard();
          else beginEditCard();
        });
      }
      const cancelEdit = app.querySelector('#cancelEditBtn');
      if (cancelEdit) cancelEdit.addEventListener('click', () => cancelEditCard());
      const saveEdit = app.querySelector('#saveEditBtn');
      if (saveEdit) saveEdit.addEventListener('click', () => saveEditCard());
      const reveal = app.querySelector('#revealBtn');
      if (reveal) reveal.addEventListener('click', () => {
        state.study.revealed = true;
        render();
      });
      const detailsBtn = app.querySelector('#cardDetailsBtn');
      if (detailsBtn) {
        detailsBtn.addEventListener('click', () => {
          state.study.detailsOpen = true;
          state.study.detailsEditing = false;
          state.study.detailsDraft = null;
          state.study.figureOpen = false;
          render();
        });
      }
      const figureBtn = app.querySelector('#cardFigureBtn');
      if (figureBtn) {
        figureBtn.addEventListener('click', () => {
          state.study.figureOpen = true;
          state.study.detailsOpen = false;
          state.study.detailsEditing = false;
          state.study.detailsDraft = null;
          render();
        });
      }
      const closeDetails = app.querySelector('#closeDetailsBtn');
      if (closeDetails) {
        closeDetails.addEventListener('click', () => closeDetailsSheet());
      }
      const editDetailsBtn = app.querySelector('#editDetailsBtn');
      if (editDetailsBtn) {
        editDetailsBtn.addEventListener('click', () => beginEditDetails(currentCard()));
      }
      const cancelDetailsBtn = app.querySelector('#cancelDetailsBtn');
      if (cancelDetailsBtn) {
        cancelDetailsBtn.addEventListener('click', () => cancelEditDetails());
      }
      const saveDetailsBtn = app.querySelector('#saveDetailsBtn');
      if (saveDetailsBtn) {
        saveDetailsBtn.addEventListener('click', () => saveDetailsEdit());
      }
      const addDetailsLinkBtn = app.querySelector('#addDetailsLinkBtn');
      if (addDetailsLinkBtn) {
        addDetailsLinkBtn.addEventListener('click', () => {
          const draft = readDetailsDraftFromDom() || state.study.detailsDraft || { summary: '', links: [] };
          if ((draft.links || []).length >= 8) {
            toast('Limit 8 links');
            return;
          }
          draft.links = [...(draft.links || []), { label: '', url: '' }];
          state.study.detailsDraft = draft;
          render();
        });
      }
      app.querySelectorAll('[data-remove-link]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.removeLink);
          const draft = readDetailsDraftFromDom() || state.study.detailsDraft;
          if (!draft) return;
          draft.links = (draft.links || []).filter((_, i) => i !== idx);
          if (!draft.links.length) draft.links = [{ label: '', url: '' }];
          state.study.detailsDraft = draft;
          render();
        });
      });
      const closeFigure = app.querySelector('#closeFigureBtn');
      if (closeFigure) {
        closeFigure.addEventListener('click', () => {
          state.study.figureOpen = false;
          render();
        });
      }
      const detailsSheet = app.querySelector('#detailsSheet');
      if (detailsSheet) {
        detailsSheet.addEventListener('click', (e) => {
          if (e.target === detailsSheet) closeDetailsSheet();
        });
      }
      const figureSheet = app.querySelector('#figureSheet');
      if (figureSheet) {
        figureSheet.addEventListener('click', (e) => {
          if (e.target === figureSheet) {
            state.study.figureOpen = false;
            render();
          }
        });
      }
      app.querySelectorAll('[data-choice-index]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (state.study.revealed || state.study.editing) return;
          const card = currentCard();
          const idx = Number(btn.dataset.choiceIndex);
          const label = Array.isArray(card?.choices) ? card.choices[idx] : null;
          state.study.revealed = true;
          state.study.quizChoice = label;
          render();
        });
      });
      app.querySelectorAll('.grade-row [data-grade]').forEach((btn) => {
        btn.addEventListener('click', () => grade(btn.dataset.grade));
      });
      const studyBackBtn = app.querySelector('#studyBackBtn');
      if (studyBackBtn) {
        studyBackBtn.addEventListener('click', () => moveStudy(-1));
      }
      const studyNextBtn = app.querySelector('#studyNextBtn');
      if (studyNextBtn) {
        studyNextBtn.addEventListener('click', () => moveStudy(1));
      }
      const adminSearchQ = app.querySelector('#adminSearchQ');
      if (adminSearchQ) {
        adminSearchQ.addEventListener('input', () => {
          state.admin.q = adminSearchQ.value;
        });
        adminSearchQ.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            runAdminSearch().catch((err) => toast(err.message));
          }
        });
      }
      const adminSearchTrack = app.querySelector('#adminSearchTrack');
      if (adminSearchTrack) {
        adminSearchTrack.addEventListener('change', async () => {
          state.admin.track = adminSearchTrack.value;
          state.admin.topic = '';
          try {
            await loadAdminTopics();
            render();
          } catch (err) {
            toast(err.message);
          }
        });
      }
      const adminSearchTopic = app.querySelector('#adminSearchTopic');
      if (adminSearchTopic) {
        adminSearchTopic.addEventListener('change', () => {
          state.admin.topic = adminSearchTopic.value;
        });
      }
      const adminHasFigure = app.querySelector('#adminHasFigure');
      if (adminHasFigure) {
        adminHasFigure.addEventListener('change', () => {
          state.admin.hasFigure = adminHasFigure.checked;
        });
      }
      const adminSearchBtn = app.querySelector('#adminSearchBtn');
      if (adminSearchBtn) {
        adminSearchBtn.addEventListener('click', () => {
          runAdminSearch().catch((err) => toast(err.message));
        });
      }
      app.querySelectorAll('[data-admin-user]').forEach((input) => {
        input.addEventListener('change', async () => {
          const googleSub = input.dataset.adminUser;
          const next = input.checked;
          input.disabled = true;
          try {
            await setUserAdminFlag(googleSub, next);
            toast(next ? 'Admin granted' : 'Admin removed');
          } catch (err) {
            input.checked = !next;
            toast(err.message);
          } finally {
            const self = state.user?.sub && state.user.sub === googleSub;
            input.disabled = Boolean(self);
          }
        });
      });
      app.querySelectorAll('[data-open-card]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.openCard;
          const card = (state.admin.results || []).find((c) => c.id === id);
          if (!card) return;
          try {
            await openStudyCard(card);
          } catch (err) {
            toast(err.message);
          }
        });
      });
      app.querySelectorAll('[data-schedule-unit]').forEach((sel) => {
        sel.addEventListener('change', () => {
          const row = sel.closest('[data-schedule-grade]');
          const input = row?.querySelector('[data-schedule-value]');
          if (!input) return;
          const never = sel.value === 'never';
          input.disabled = never;
          if (never) input.value = '';
          else if (input.value === '') input.value = '1';
        });
      });
      const resetScheduleBtn = app.querySelector('#resetScheduleBtn');
      if (resetScheduleBtn) {
        resetScheduleBtn.addEventListener('click', () => {
          state.admin.schedule = {
            again: { value: 10, unit: 'minutes' },
            hard: { value: 1, unit: 'days' },
            good: { value: 7, unit: 'days' },
            easy: { value: 0, unit: 'never' }
          };
          render();
        });
      }
      const saveScheduleBtn = app.querySelector('#saveScheduleBtn');
      if (saveScheduleBtn) {
        saveScheduleBtn.addEventListener('click', async () => {
          try {
            const schedule = readScheduleFromDom();
            const result = await api('/api/study-schedule', {
              method: 'PUT',
              body: JSON.stringify({ schedule })
            });
            state.admin.schedule = result.schedule;
            toast('Due schedule saved');
            render();
          } catch (err) {
            toast(err.message || 'Save failed');
          }
        });
      }
      const importBtn = app.querySelector('#importBtn');
      if (importBtn) {
        importBtn.addEventListener('click', async () => {
          try {
            const body = {
              track_id: app.querySelector('#importTrack').value,
              topic_title: app.querySelector('#importTopic').value || 'Imported deck',
              csv: app.querySelector('#importCsv').value,
              filename: 'paste.csv',
              password: app.querySelector('#importPassword').value
            };
            const result = await api('/api/import', {
              method: 'POST',
              body: JSON.stringify(body),
              headers: body.password ? { 'x-glider-import-password': body.password } : {}
            });
            toast(`Imported ${result.count} cards`);
            state.imports = (await api('/api/imports')).imports;
            await loadHome();
            state.view = 'admin';
            await runAdminSearch();
          } catch (err) {
            toast(err.message);
          }
        });
      }
    }

    document.getElementById('nav').addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-view]');
      if (!btn) return;
      const nextView = btn.dataset.view;
      if (nextView === 'admin' && !isAdminUser()) {
        toast('Admin access required');
        return;
      }
      state.view = nextView;
      if (state.view === 'home') {
        await loadHome();
        return;
      }
      if (state.view === 'progress') {
        await loadProgress();
        return;
      }
      if (state.view === 'study') {
        state.topics = (await api('/api/topics?track=' + encodeURIComponent(state.study.track))).topics;
        await loadStudyDeck();
        return;
      }
      if (state.view === 'aircraft') {
        if (!state.aircraft.page) state.aircraft.page = 'hub';
        render();
        return;
      }
      if (state.view === 'admin') {
        await loadAdmin();
        return;
      }
    });

    loadAuthUser()
      .then(() => loadHome())
      .catch((err) => {
        app.innerHTML = `<div class="empty">Failed to load: ${escapeHtml(err.message)}</div>`;
      });
  </script>
</body>
</html>
