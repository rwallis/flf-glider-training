<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A6FA3" />
  <title>FLF Glider Study</title>
  <style>
    :root {
      --sky: #2B8FCC;
      --sky-deep: #1A6FA3;
      --grass: #2F7D32;
      --sun: #F0B429;
      --copper: #D65A1F;
      --ink: #1C2A33;
      --paper: #F7FAFC;
      --card: #FFFFFF;
      --muted: #5A6B76;
      --line: #D5E2EA;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      min-height: 100%;
    }
    body { padding-bottom: calc(72px + var(--safe-bottom)); }
    header.app-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(120deg, var(--sky-deep), var(--sky));
      color: #fff;
      padding: 14px 16px 12px;
    }
    header.app-bar .bar-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    header.app-bar h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    header.app-bar p {
      margin: 4px 0 0;
      opacity: 0.9;
      font-size: 0.82rem;
    }
    .header-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      font-size: 0.72rem;
      opacity: 0.95;
      max-width: 62%;
      text-align: right;
      line-height: 1.25;
    }
    .header-user {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }
    .header-user img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.45);
    }
    .header-user .user-name {
      font-weight: 700;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    a.header-logout {
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.66rem;
      font-weight: 800;
      white-space: nowrap;
    }
    a.header-logout:hover { background: rgba(255,255,255,0.14); }
    .header-version {
      font-family: ui-monospace, Consolas, monospace;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .deploy-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.18);
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .deploy-pill.ok { border-color: #86efac; color: #dcfce7; }
    .deploy-pill.active { border-color: #fde68a; color: #fef3c7; }
    .deploy-pill.ready { border-color: #67e8f9; color: #ecfeff; }
    .deploy-pill.error { border-color: #fca5a5; color: #fee2e2; }
    .deploy-pill.muted { opacity: 0.85; }
    .deploy-pill button {
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.18);
      color: #fff;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.66rem;
      font-weight: 800;
    }
    main { padding: 14px 14px 24px; max-width: 640px; margin: 0 auto; }
    .hidden { display: none !important; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
    }
    .stat b { display: block; font-size: 1.35rem; color: var(--sky-deep); }
    .stat span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .track {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .track .badge {
      flex: 0 0 auto;
      min-width: 52px;
      height: 44px;
      padding: 0 8px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #fff;
      background: var(--sky);
      font-size: 0.68rem;
      text-align: center;
      line-height: 1.1;
    }
    .track.upload .badge { background: var(--copper); }
    .track h2 { margin: 0 0 4px; font-size: 1.05rem; }
    .track p { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .track .meta { margin-top: 8px; font-size: 0.8rem; color: var(--sky-deep); font-weight: 700; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button, .btn {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: var(--sky-deep);
      color: #fff;
    }
    button.secondary, .btn.secondary { background: #E8F2F8; color: var(--sky-deep); }
    button.good { background: var(--grass); }
    button.hard { background: #C48A12; }
    button.again { background: var(--copper); }
    button.easy { background: #1F8A70; }
    button:disabled { opacity: 0.5; cursor: default; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      border-radius: 999px;
      padding: 8px 12px;
      background: #E8F2F8;
      color: var(--sky-deep);
      font-size: 0.8rem;
      font-weight: 700;
      border: 0;
      white-space: nowrap;
    }
    .chip.active { background: var(--sky-deep); color: #fff; }
    .hint {
      margin: -4px 0 12px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .flash {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 16px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
    }
    .flash .q {
      font-size: 1.15rem;
      font-weight: 700;
      flex: 1;
    }
    .flash .a {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--line);
      color: var(--ink);
      font-size: 1rem;
    }
    .flash .source {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .grade-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .grade-row button { padding: 14px 6px; font-size: 0.85rem; }
    .nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
      background: #fff;
      border-top: 1px solid var(--line);
      padding: 8px 4px calc(8px + var(--safe-bottom));
    }
    .polar-chart {
      width: 100%;
      height: auto;
      background: #fafbfc;
      border: 1px solid var(--line);
      border-radius: 14px;
      display: block;
      margin: 8px 0 10px;
    }
    .polar-sliders {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 8px 0 4px;
    }
    .polar-sliders label {
      display: block;
      margin-bottom: 2px;
      font-size: 0.8rem;
    }
    .polar-sliders input[type="range"] {
      margin: 4px 0 0;
      padding: 0;
      border: none;
      background: transparent;
    }
    .polar-status {
      background: #E8F2F8;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.88rem;
      color: var(--ink);
      margin: 0 0 10px;
    }
    .polar-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 12px;
    }
    .polar-pill {
      flex: 1 1 calc(50% - 8px);
      min-width: 140px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .polar-pill .k {
      display: block;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .polar-pill .v {
      display: block;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--sky-deep);
      line-height: 1.2;
    }
    .polar-pill .r {
      display: block;
      margin-top: 2px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .polar-pill .r.up { color: var(--grass); }
    .polar-pill .r.down { color: var(--copper); }
    .polar-ref {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      margin-top: 8px;
      display: block;
    }
    .warn {
      background: #fff4e5;
      border: 1px solid #f0c36d;
      color: #7a4b00;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.88rem;
      margin: 8px 0 12px;
    }
    @media (max-width: 420px) {
      .polar-sliders { grid-template-columns: 1fr; }
    }
    .nav button {
      background: transparent;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 8px 4px;
      border-radius: 10px;
    }
    .nav button.active { color: var(--sky-deep); background: #E8F2F8; }
    .nav button span { display: block; font-size: 1.1rem; margin-bottom: 2px; }
    textarea, input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      background: #fff;
      margin: 6px 0 12px;
    }
    label { font-size: 0.85rem; font-weight: 700; color: var(--muted); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(84px + var(--safe-bottom));
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 40;
      max-width: 90%;
    }
    .toast.show { opacity: 1; }
    .empty {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
    }
    .choices { display: grid; gap: 8px; margin-top: 14px; }
    .choices button {
      text-align: left;
      background: #E8F2F8;
      color: var(--ink);
    }
    .choices button.correct { background: #d7f0d9; }
    .choices button.wrong { background: #f8d9d0; }
  </style>
</head>
<body>
  <header class="app-bar">
    <div class="bar-top">
      <div>
        <h1>FLF Glider Study</h1>
        <p id="subtitle">Commercial focus · SGS 2-33 · Common knowledge</p>
      </div>
      <div class="header-meta" id="app-header-meta">
        <span class="header-user hidden" id="header-user"></span>
        <span class="header-version" id="header-version">v…</span>
        <a class="header-logout hidden" id="header-logout" href="/logout">Logout</a>
        <span id="header-deploy" class="deploy-pill muted">Deploy …</span>
      </div>
    </div>
  </header>
  <main id="app"></main>
  <nav class="nav" id="nav">
    <button type="button" data-view="home"><span>⌂</span>Home</button>
    <button type="button" data-view="study"><span>✎</span>Study</button>
    <button type="button" data-view="aircraft"><span>✈</span>Aircraft</button>
    <button type="button" data-view="progress"><span>▣</span>Progress</button>
    <button type="button" data-view="import"><span>↑</span>Import</button>
  </nav>
  <div class="toast" id="toast"></div>
  <script src="/aircraft/polar-233.js"></script>
  <script>
    const state = {
      view: 'home',
      tracks: [],
      topics: [],
      stats: null,
      study: {
        track: 'commercial',
        topic: '',
        mode: 'due',
        cards: [],
        index: 0,
        revealed: false,
        quizChoice: null
      },
      imports: [],
      aircraft: {
        page: 'hub', // hub | sgs233
        config: 'dual',
        macCready: 2.0,
        wind: 0 // kt; +tail / −head
      }
    };

    const app = document.getElementById('app');
    const toastEl = document.getElementById('toast');
    let pageLoadDeploymentId = null;

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    async function api(path, opts) {
      const res = await fetch(path, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', ...(opts?.headers || {}) },
        ...opts
      });
      if (res.status === 401 && !String(path).startsWith('/auth/me')) {
        window.location.href = '/login?return=' + encodeURIComponent(window.location.pathname || '/');
        throw new Error('Authentication required');
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadAuthUser() {
      const el = document.getElementById('header-user');
      const logoutEl = document.getElementById('header-logout');
      if (!el) return;
      try {
        const me = await api('/auth/me');
        if (!me.authenticated || !me.user) {
          el.classList.add('hidden');
          if (logoutEl) logoutEl.classList.add('hidden');
          return;
        }
        const u = me.user;
        const avatar = u.picture
          ? `<img src="${escapeHtml(u.picture)}" alt="" referrerpolicy="no-referrer" />`
          : '';
        el.innerHTML = `${avatar}<span class="user-name" title="${escapeHtml(u.email)}">${escapeHtml(u.name || u.email)}</span>`;
        el.classList.remove('hidden');
        if (logoutEl) logoutEl.classList.remove('hidden');
        state.user = u;
      } catch {
        el.classList.add('hidden');
        if (logoutEl) logoutEl.classList.add('hidden');
      }
    }

    function formatHeaderVersion(meta) {
      if (!meta) return 'app';
      const commit = meta.git_commit ? (' · ' + meta.git_commit) : '';
      const env = meta.environment ? (' · ' + meta.environment) : '';
      return 'v' + (meta.version || '?') + commit + env;
    }

    function setDeployPill(ui, gitCommit) {
      const el = document.getElementById('header-deploy');
      if (!el || !ui) return;
      el.className = 'deploy-pill ' + (ui.tone || 'muted');
      if (ui.refresh_recommended) {
        el.innerHTML = '<span>' + (ui.label || 'New version ready') + '</span> <button type="button" data-deploy-refresh>Refresh</button>';
        const btn = el.querySelector('[data-deploy-refresh]');
        if (btn) btn.addEventListener('click', function () { window.location.reload(); });
        return;
      }
      const commit = gitCommit ? (' · ' + gitCommit) : '';
      el.textContent = (ui.label || 'Deploy') + commit;
    }

    async function pollDeployStatus() {
      const el = document.getElementById('header-deploy');
      if (!el) return;
      try {
        const query = pageLoadDeploymentId
          ? ('?page_load_deployment_id=' + encodeURIComponent(pageLoadDeploymentId))
          : '';
        const deploy = await api('/api/deploy-status' + query);
        if (!pageLoadDeploymentId && deploy.instance?.deployment_id) {
          pageLoadDeploymentId = deploy.instance.deployment_id;
        }
        setDeployPill(deploy.ui || {}, deploy.instance?.git_commit || null);
      } catch {
        el.className = 'deploy-pill active';
        el.textContent = 'Reconnecting…';
      }
    }

    async function loadHeaderMeta() {
      try {
        const [meta, deploy] = await Promise.all([
          api('/api/v1/app/meta'),
          api('/api/deploy-status')
        ]);
        const versionEl = document.getElementById('header-version');
        if (versionEl) versionEl.textContent = formatHeaderVersion(meta);
        if (!pageLoadDeploymentId && deploy.instance?.deployment_id) {
          pageLoadDeploymentId = deploy.instance.deployment_id;
        }
        setDeployPill(deploy.ui || {}, deploy.instance?.git_commit || meta.git_commit || null);
      } catch {
        const versionEl = document.getElementById('header-version');
        if (versionEl) versionEl.textContent = 'app';
      }
    }

    loadAuthUser();
    loadHeaderMeta();
    window.setInterval(pollDeployStatus, 15000);

    function trackLabel(id) {
      return ({
        common: 'Common Knowledge',
        private: 'Private Glider',
        commercial: 'Commercial',
        cfi_g: 'CFI-G',
        aircraft_233: 'SGS 2-33'
      })[id] || id;
    }

    function setNav() {
      document.querySelectorAll('#nav button').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.view === state.view);
      });
    }

    async function loadHome() {
      const [tracks, stats] = await Promise.all([
        api('/api/tracks'),
        api('/api/stats')
      ]);
      state.tracks = tracks.tracks;
      state.stats = stats;
      render();
    }

    async function loadStudyDeck() {
      const q = new URLSearchParams({
        track: state.study.track,
        mode: state.study.mode
      });
      if (state.study.topic) q.set('topic', state.study.topic);
      const data = await api('/api/study?' + q.toString());
      state.study.cards = data.cards;
      state.study.index = 0;
      state.study.revealed = false;
      state.study.quizChoice = null;
      render();
    }

    async function grade(g) {
      const card = state.study.cards[state.study.index];
      if (!card) return;
      await api('/api/study/' + encodeURIComponent(card.id), {
        method: 'POST',
        body: JSON.stringify({ grade: g })
      });
      state.study.cards.splice(state.study.index, 1);
      state.study.revealed = false;
      state.study.quizChoice = null;
      if (state.study.index >= state.study.cards.length) state.study.index = 0;
      toast(g.toUpperCase());
      render();
    }

    function currentCard() {
      return state.study.cards[state.study.index] || null;
    }

    function renderHome() {
      const s = state.stats || { cards: 0, studied: 0, due: 0 };
      return `
        <div class="stats">
          <div class="stat"><b>${s.cards}</b><span>Cards</span></div>
          <div class="stat"><b>${s.studied}</b><span>Studied</span></div>
          <div class="stat"><b>${s.due}</b><span>Due</span></div>
        </div>
        <p style="color:var(--muted);font-size:0.9rem;margin:0 0 12px">
          Self-study now: <strong>Commercial</strong> + Common Knowledge + SGS 2-33.
          Upload CFI-G Q&amp;A next, Private Glider last.
        </p>
        ${state.tracks.map((t) => `
          <article class="track ${t.status === 'upload_later' ? 'upload' : ''}">
            <div class="badge">${trackLabel(t.id)}</div>
            <div style="flex:1">
              <h2>${escapeHtml(t.title)}</h2>
              <p>${escapeHtml(t.description || '')}</p>
              <div class="meta">${t.card_count || 0} cards · ${t.status === 'upload_later' ? 'upload later' : 'ready'}</div>
              <div class="btn-row">
                <button type="button" data-open-study="${t.id}" ${!(t.card_count > 0) ? 'disabled' : ''}>Study</button>
                ${t.status === 'upload_later' ? '<button type="button" class="secondary" data-view-jump="import">Import Q&amp;A</button>' : ''}
              </div>
            </div>
          </article>
        `).join('')}
      `;
    }

    function renderStudy() {
      const card = currentCard();
      const topics = state.topics.filter((t) => t.track_id === state.study.track);
      return `
        <div class="chip-row">
          ${['commercial','common','aircraft_233','cfi_g','private'].map((id) => `
            <button type="button" class="chip ${state.study.track === id ? 'active' : ''}" data-set-track="${id}">${trackLabel(id)}</button>
          `).join('')}
        </div>
        <div class="chip-row">
          <button type="button" class="chip ${state.study.mode === 'due' ? 'active' : ''}" data-set-mode="due">Due &amp; new</button>
          <button type="button" class="chip ${state.study.mode === 'all' ? 'active' : ''}" data-set-mode="all">All cards</button>
          <button type="button" class="chip ${state.study.mode === 'weak' ? 'active' : ''}" data-set-mode="weak">Weak cards</button>
        </div>
        <p class="hint">${
          state.study.mode === 'due'
            ? 'Due &amp; new: cards you have never studied, plus cards whose review date is today or overdue.'
            : state.study.mode === 'weak'
              ? 'Weak cards: ones you marked Again often or that have a low ease score.'
              : 'All cards: every card in this category, ignoring review schedule.'
        }</p>
        <label>Topic</label>
        <select id="topicSelect">
          <option value="">All topics</option>
          ${topics.map((t) => `<option value="${t.id}" ${state.study.topic === t.id ? 'selected' : ''}>${escapeHtml(t.title)}</option>`).join('')}
        </select>
        ${!card ? `<div class="empty">No cards in this deck filter. Try All, another track, or Import.</div>` : `
          <div class="flash">
            <div style="font-size:0.78rem;color:var(--muted);margin-bottom:8px">
              ${state.study.index + 1} remaining in session · ${escapeHtml(card.topic_id || '')}
            </div>
            <div class="q">${escapeHtml(card.question)}</div>
            ${Array.isArray(card.choices) && card.choices.length ? `
              <div class="choices">
                ${card.choices.map((c) => {
                  let cls = '';
                  if (state.study.revealed) {
                    if (c === card.answer) cls = 'correct';
                    else if (state.study.quizChoice === c) cls = 'wrong';
                  }
                  return `<button type="button" data-choice-label="${escapeHtml(c)}" class="${cls}" ${state.study.revealed ? 'disabled' : ''}>${escapeHtml(c)}</button>`;
                }).join('')}
              </div>
            ` : (!state.study.revealed
              ? `<div class="btn-row"><button type="button" id="revealBtn">Show answer</button></div>`
              : '')}
            ${state.study.revealed ? `
              ${!(Array.isArray(card.choices) && card.choices.length) ? `<div class="a">${escapeHtml(card.answer)}</div>` : ''}
              <div class="source">${escapeHtml(card.source || '')}</div>
              <div class="grade-row">
                <button type="button" class="again" data-grade="again">Again</button>
                <button type="button" class="hard" data-grade="hard">Hard</button>
                <button type="button" class="good" data-grade="good">Good</button>
                <button type="button" class="easy" data-grade="easy">Easy</button>
              </div>
            ` : ''}
          </div>
        `}
      `;
    }

    function fmt(n, digits = 1) {
      if (n == null || Number.isNaN(n)) return '—';
      return Number(n).toFixed(digits);
    }

    function renderAircraftHub() {
      return `
        <p style="color:var(--muted);font-size:0.9rem;margin:0 0 12px">
          Aircraft performance tools for club ships. Start with the Schweizer <strong>SGS 2-33</strong> polar.
        </p>
        <article class="track">
          <div class="badge">2-33</div>
          <div style="flex:1">
            <h2>SGS 2-33</h2>
            <p>MacCready tangent construction — speed to fly with headwind / tailwind.</p>
            <div class="btn-row">
              <button type="button" data-aircraft-page="sgs233">Open polar</button>
              <button type="button" class="secondary" data-open-study="aircraft_233">Study cards</button>
            </div>
          </div>
        </article>
      `;
    }

    function macCreadySvg(result) {
      const W = 360;
      const H = 280;
      const pad = { l: 42, r: 14, t: 18, b: 36 };
      const plotW = W - pad.l - pad.r;
      const plotH = H - pad.t - pad.b;
      const xMin = 0;
      const xMax = 80;
      const yMin = -6;
      const yMax = 4;
      const xOf = (kt) => pad.l + ((kt - xMin) / (xMax - xMin)) * plotW;
      const yOf = (vs) => pad.t + (1 - (vs - yMin) / (yMax - yMin)) * plotH;
      const zeroY = yOf(0);

      const polarPts = (result.polar_gs || []).filter((p) => p.x_kt >= 0 && p.x_kt <= xMax + 2);
      const polarPath = Sgs233Polar.polarToBezierPath(
        polarPts,
        (p) => xOf(p.x_kt),
        (p) => yOf(p.vs_kt)
      );

      let tangentLayer = '';
      if (result.ok && result.tangent) {
        const t = result.tangent;
        const mc = result.mac_cready_kt;
        const slope = t.slope;
        const xEnd = xMax;
        const yEnd = mc + slope * xEnd;
        const xTouch = t.gs_kt;
        tangentLayer = `
          <line x1="${xOf(0)}" y1="${yOf(mc)}" x2="${xOf(xEnd)}" y2="${yOf(yEnd)}" stroke="#E6B800" stroke-width="2.5"/>
          <line x1="${xOf(xTouch)}" y1="${yOf(t.vs_kt)}" x2="${xOf(xTouch)}" y2="${zeroY}" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
          <circle cx="${xOf(xTouch)}" cy="${yOf(t.vs_kt)}" r="5" fill="#E6B800" stroke="#1C2A33" stroke-width="1.2"/>
          <text x="${xOf(xTouch) + 6}" y="${yOf(t.vs_kt) - 8}" font-size="11" fill="#1C2A33" font-weight="700">Tangent point</text>
          <text x="${xOf(xTouch)}" y="${zeroY + 14}" text-anchor="middle" font-size="11" fill="#1C2A33" font-weight="700">${Math.round(t.ias_kt)}</text>
        `;
      }

      const xTicks = [0, 15, 30, 45, 60, 75];
      const yTicks = [4, 2, 0, -2, -4, -6];

      return `
        <svg class="polar-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="2-33 MacCready tangent construction">
          <rect x="0" y="0" width="${W}" height="${H}" fill="#fafbfc"/>
          <rect x="${pad.l}" y="${pad.t}" width="${plotW}" height="${plotH}" fill="#fff" stroke="#cbd5e1"/>
          ${xTicks.map((v) => `<line x1="${xOf(v)}" y1="${pad.t}" x2="${xOf(v)}" y2="${pad.t + plotH}" stroke="#eef2f6"/><text x="${xOf(v)}" y="${H - 12}" text-anchor="middle" font-size="10" fill="#64748b">${v}</text>`).join('')}
          ${yTicks.map((v) => `<line x1="${pad.l}" y1="${yOf(v)}" x2="${pad.l + plotW}" y2="${yOf(v)}" stroke="${v === 0 ? '#94a3b8' : '#eef2f6'}" stroke-width="${v === 0 ? 1.4 : 1}"/><text x="${pad.l - 6}" y="${yOf(v) + 3}" text-anchor="end" font-size="10" fill="#64748b">${v}</text>`).join('')}
          <path d="${polarPath}" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          ${tangentLayer}
          <text x="${W / 2}" y="${H - 2}" text-anchor="middle" font-size="11" fill="#334155">Indicated airspeed (knots)</text>
          <text x="14" y="${pad.t + plotH / 2}" text-anchor="middle" font-size="11" fill="#334155" transform="rotate(-90 14 ${pad.t + plotH / 2})">Vertical speed (knots)</text>
        </svg>
      `;
    }

    function relativeClass(pct, betterWhenHigher) {
      if (pct == null || Number.isNaN(pct)) return '';
      const delta = pct - 100;
      if (Math.abs(delta) < 1.5) return '';
      const better = betterWhenHigher ? delta > 0 : delta < 0;
      return better ? 'up' : 'down';
    }

    function relativeText(pct, label) {
      if (pct == null || Number.isNaN(pct)) return '';
      const delta = pct - 100;
      const sign = delta >= 0 ? '+' : '';
      return `${sign}${fmt(delta, 0)}% vs ${label}`;
    }

    function polarPillsHtml(result) {
      if (!result.ok || !result.metrics) {
        return `<div class="polar-pills" id="polarPills"></div>`;
      }
      const m = result.metrics;
      const airRel = relativeText(m.air_ld_vs_best_pct, 'best L/D');
      const gndRel = relativeText(m.ground_ld_vs_best_pct, 'best L/D');
      const sinkRel = relativeText(m.sink_vs_min_pct, 'min sink');
      const stfDelta = m.delta_stf_kt;
      const stfRel = Math.abs(stfDelta) < 0.3
        ? 'same as calm STF'
        : `${stfDelta > 0 ? '+' : ''}${fmt(stfDelta, 1)} kt vs calm STF`;
      return `
        <div class="polar-pills" id="polarPills">
          <div class="polar-pill">
            <span class="k">Air L/D at STF</span>
            <span class="v" id="pillAirLd">${fmt(m.air_ld, 1)}:1</span>
            <span class="r ${relativeClass(m.air_ld_vs_best_pct, true)}" id="pillAirLdRel">${airRel}</span>
          </div>
          <div class="polar-pill">
            <span class="k">Ground L/D (wind)</span>
            <span class="v" id="pillGndLd">${fmt(m.ground_ld, 1)}:1</span>
            <span class="r ${relativeClass(m.ground_ld_vs_best_pct, true)}" id="pillGndLdRel">${gndRel}</span>
          </div>
          <div class="polar-pill">
            <span class="k">Sink rate at STF</span>
            <span class="v" id="pillSink">${fmt(m.sink_kt, 2)} kt</span>
            <span class="r ${relativeClass(m.sink_vs_min_pct, false)}" id="pillSinkRel">${fmt(m.sink_fpm, 0)} fpm · ${sinkRel}</span>
          </div>
          <div class="polar-pill">
            <span class="k">Speed to fly</span>
            <span class="v" id="pillStf">${Math.round(result.tangent.ias_kt)} kt</span>
            <span class="r" id="pillStfRel">${stfRel}</span>
          </div>
        </div>
      `;
    }

    function updatePolarPills(result) {
      const host = document.getElementById('polarPills');
      if (!host) return;
      host.outerHTML = polarPillsHtml(result);
    }

    function renderAircraft233() {
      const polar = typeof Sgs233Polar !== 'undefined' ? Sgs233Polar : null;
      if (!polar) {
        return `<div class="empty">Polar module failed to load.</div>`;
      }
      const result = polar.findMacCreadyTangent({
        config: state.aircraft.config,
        macCreadyKt: state.aircraft.macCready,
        windKt: state.aircraft.wind
      });
      const cfg = result.config || polar.getConfig(state.aircraft.config);
      const t = result.ok ? result.tangent : null;
      const status = result.ok
        ? `Tangent touches at <strong>${Math.round(t.ias_kt)} kt</strong> (${Math.round(t.mph)} mph): approximate still-air speed to fly.`
        : escapeHtml(result.error || 'No tangent');
      return `
        <div class="btn-row" style="margin-top:0">
          <button type="button" class="secondary" data-aircraft-page="hub">← Aircraft</button>
        </div>
        <h2 style="margin:10px 0 6px;font-size:1.15rem">2-33 MacCready tangent-line construction</h2>
        <div class="chip-row">
          <button type="button" class="chip ${state.aircraft.config === 'solo' ? 'active' : ''}" data-polar-config="solo">Solo ${cfg.key === 'solo' ? cfg.weight_lb : 790} lb</button>
          <button type="button" class="chip ${state.aircraft.config === 'dual' ? 'active' : ''}" data-polar-config="dual">Dual ${cfg.key === 'dual' ? cfg.weight_lb : 1040} lb</button>
        </div>
        <div class="polar-sliders">
          <div>
            <label>MacCready setting: <span id="mcLabel">${fmt(state.aircraft.macCready, 1)} kt</span></label>
            <input id="polarMc" type="range" min="0" max="6" step="0.1" value="${state.aircraft.macCready}" />
          </div>
          <div>
            <label>Wind: <span id="polarWindLabel">${Sgs233Polar.windLabel(state.aircraft.wind)}</span></label>
            <input id="polarWind" type="range" min="-25" max="25" step="1" value="${state.aircraft.wind}" />
          </div>
        </div>
        <div id="polarSvgWrap">${macCreadySvg(result)}</div>
        <div class="polar-status" id="polarStatus">${status}</div>
        ${polarPillsHtml(result)}
        <p style="font-size:0.78rem;color:var(--muted);margin:0 0 8px">
          ${escapeHtml(cfg.label)} ${cfg.weight_lb} lb · S=${cfg.wing_loading_psf} psf.
          Blue = smooth SFM polar; yellow = MacCready tangent. Wind shifts polar on groundspeed axis.
        </p>
        <details>
          <summary style="cursor:pointer;font-weight:700;color:var(--sky-deep)">SFM source polar chart</summary>
          <img class="polar-ref" src="/aircraft/sgs-233-polar.png" alt="SGS 2-33A calculated performance curves" />
        </details>
      `;
    }

    function updatePolarLive() {
      if (typeof Sgs233Polar === 'undefined') return;
      const result = Sgs233Polar.findMacCreadyTangent({
        config: state.aircraft.config,
        macCreadyKt: state.aircraft.macCready,
        windKt: state.aircraft.wind
      });
      const mcLabel = document.getElementById('mcLabel');
      const windLabel = document.getElementById('polarWindLabel');
      if (mcLabel) mcLabel.textContent = fmt(state.aircraft.macCready, 1) + ' kt';
      if (windLabel) windLabel.textContent = Sgs233Polar.windLabel(state.aircraft.wind);
      const status = document.getElementById('polarStatus');
      if (status) {
        if (result.ok) {
          const t = result.tangent;
          status.innerHTML = `Tangent touches at <strong>${Math.round(t.ias_kt)} kt</strong> (${Math.round(t.mph)} mph): approximate still-air speed to fly.`;
        } else {
          status.textContent = result.error || 'No tangent';
        }
      }
      const wrap = document.getElementById('polarSvgWrap');
      if (wrap) wrap.innerHTML = macCreadySvg(result);
      updatePolarPills(result);
    }

    function renderProgress() {
      const s = state.stats || { cards: 0, studied: 0, due: 0 };
      return `
        <div class="stats">
          <div class="stat"><b>${s.cards}</b><span>Cards</span></div>
          <div class="stat"><b>${s.studied}</b><span>Studied</span></div>
          <div class="stat"><b>${s.due}</b><span>Due</span></div>
        </div>
        <article class="track">
          <div class="badge">SRS</div>
          <div>
            <h2>Spaced repetition</h2>
            <p>Again / Hard / Good / Easy updates due dates. Progress is saved to <strong>your signed-in Google account</strong> in shared Postgres.</p>
            <div class="btn-row">
              <button type="button" data-open-study="commercial">Study commercial due</button>
            </div>
          </div>
        </article>
        <article class="track">
          <div class="badge" style="background:var(--copper)">↑</div>
          <div>
            <h2>Upload plan</h2>
            <p>1) Keep drilling Commercial + 2-33 + Common.<br>
               2) Import CFI-G FOI / Q&amp;A when you start that study.<br>
               3) Import Private Q&amp;A last.</p>
          </div>
        </article>
      `;
    }

    function renderImport() {
      return `
        <p style="color:var(--muted);font-size:0.9rem">
          Upload CSV (<code>question,answer</code> or <code>topic,question,answer</code>) or paste JSON cards.
          Set track to <strong>cfi_g</strong> next, then <strong>private</strong>.
        </p>
        <label>Track</label>
        <select id="importTrack">
          <option value="cfi_g">CFI-G</option>
          <option value="private">Private</option>
          <option value="commercial">Commercial</option>
          <option value="common">Common</option>
          <option value="aircraft_233">Schweizer 2-33</option>
        </select>
        <label>Topic title</label>
        <input id="importTopic" placeholder="e.g. FOI — Levels of learning" />
        <label>Import password (if configured on Railway)</label>
        <input id="importPassword" type="password" placeholder="GLIDER_IMPORT_PASSWORD" autocomplete="off" />
        <label>CSV</label>
        <textarea id="importCsv" rows="8" placeholder="topic,question,answer&#10;FOI,What are the four levels of learning?,Rote Understanding Application Correlation"></textarea>
        <div class="btn-row">
          <button type="button" id="importBtn">Import deck</button>
        </div>
        <h2 style="font-size:1rem;margin:18px 0 8px">Recent imports</h2>
        ${(state.imports || []).length ? state.imports.map((imp) => `
          <div class="track"><div class="badge">${trackLabel(imp.track_id)}</div>
            <div><h2 style="font-size:0.95rem">${escapeHtml(imp.filename || 'upload')}</h2>
            <p>${imp.card_count} cards · ${escapeHtml(imp.created_at || '')}</p></div></div>
        `).join('') : '<div class="empty">No imports yet</div>'}
      `;
    }

    function render() {
      setNav();
      const sub = document.getElementById('subtitle');
      if (state.view === 'home') sub.textContent = 'Pick a track · Commercial is ready';
      if (state.view === 'study') sub.textContent = `Studying ${state.study.track} · ${state.study.cards.length} in session`;
      if (state.view === 'aircraft') {
        sub.textContent = state.aircraft.page === 'sgs233'
          ? 'SGS 2-33 · MacCready + wind'
          : 'Aircraft performance';
      }
      if (state.view === 'progress') sub.textContent = 'Your spaced-repetition progress';
      if (state.view === 'import') sub.textContent = 'Upload CFI-G then Private Q&A';

      if (state.view === 'home') app.innerHTML = renderHome();
      else if (state.view === 'study') app.innerHTML = renderStudy();
      else if (state.view === 'aircraft') {
        app.innerHTML = state.aircraft.page === 'sgs233' ? renderAircraft233() : renderAircraftHub();
      }
      else if (state.view === 'progress') app.innerHTML = renderProgress();
      else if (state.view === 'import') app.innerHTML = renderImport();

      bind();
    }

    function bind() {
      app.querySelectorAll('[data-open-study]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.view = 'study';
          state.study.track = btn.dataset.openStudy;
          state.study.topic = '';
          state.topics = (await api('/api/topics?track=' + encodeURIComponent(state.study.track))).topics;
          await loadStudyDeck();
        });
      });
      app.querySelectorAll('[data-view-jump]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.view = btn.dataset.viewJump;
          render();
        });
      });
      app.querySelectorAll('[data-aircraft-page]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.view = 'aircraft';
          state.aircraft.page = btn.dataset.aircraftPage;
          render();
        });
      });
      app.querySelectorAll('[data-polar-config]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.aircraft.config = btn.dataset.polarConfig;
          render();
        });
      });
      const polarMc = app.querySelector('#polarMc');
      if (polarMc) {
        polarMc.addEventListener('input', () => {
          state.aircraft.macCready = Number(polarMc.value);
          updatePolarLive();
        });
      }
      const polarWind = app.querySelector('#polarWind');
      if (polarWind) {
        polarWind.addEventListener('input', () => {
          state.aircraft.wind = Number(polarWind.value);
          updatePolarLive();
        });
      }
      app.querySelectorAll('[data-set-track]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.study.track = btn.dataset.setTrack;
          state.study.topic = '';
          state.topics = (await api('/api/topics?track=' + encodeURIComponent(state.study.track))).topics;
          await loadStudyDeck();
        });
      });
      app.querySelectorAll('[data-set-mode]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.study.mode = btn.dataset.setMode;
          await loadStudyDeck();
        });
      });
      const topicSelect = app.querySelector('#topicSelect');
      if (topicSelect) {
        topicSelect.addEventListener('change', async () => {
          state.study.topic = topicSelect.value;
          await loadStudyDeck();
        });
      }
      const reveal = app.querySelector('#revealBtn');
      if (reveal) reveal.addEventListener('click', () => {
        state.study.revealed = true;
        render();
      });
      app.querySelectorAll('[data-choice-label]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (state.study.revealed) return;
          state.study.revealed = true;
          state.study.quizChoice = btn.getAttribute('data-choice-label');
          render();
        });
      });
      app.querySelectorAll('[data-grade]').forEach((btn) => {
        btn.addEventListener('click', () => grade(btn.dataset.grade));
      });
      const importBtn = app.querySelector('#importBtn');
      if (importBtn) {
        importBtn.addEventListener('click', async () => {
          try {
            const body = {
              track_id: app.querySelector('#importTrack').value,
              topic_title: app.querySelector('#importTopic').value || 'Imported deck',
              csv: app.querySelector('#importCsv').value,
              filename: 'paste.csv',
              password: app.querySelector('#importPassword').value
            };
            const result = await api('/api/import', {
              method: 'POST',
              body: JSON.stringify(body),
              headers: body.password ? { 'x-glider-import-password': body.password } : {}
            });
            toast(`Imported ${result.count} cards`);
            state.imports = (await api('/api/imports')).imports;
            await loadHome();
            state.view = 'import';
            render();
          } catch (err) {
            toast(err.message);
          }
        });
      }
    }

    document.getElementById('nav').addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-view]');
      if (!btn) return;
      state.view = btn.dataset.view;
      if (state.view === 'home' || state.view === 'progress') {
        await loadHome();
        return;
      }
      if (state.view === 'study') {
        state.topics = (await api('/api/topics?track=' + encodeURIComponent(state.study.track))).topics;
        await loadStudyDeck();
        return;
      }
      if (state.view === 'aircraft') {
        if (!state.aircraft.page) state.aircraft.page = 'hub';
        render();
        return;
      }
      if (state.view === 'import') {
        state.imports = (await api('/api/imports')).imports;
        render();
      }
    });

    loadHome().catch((err) => {
      app.innerHTML = `<div class="empty">Failed to load: ${escapeHtml(err.message)}</div>`;
    });
  </script>
</body>
</html>
