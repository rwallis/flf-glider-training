<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A6FA3" />
  <title>FLF Glider Study</title>
  <style>
    :root {
      --sky: #2B8FCC;
      --sky-deep: #1A6FA3;
      --grass: #2F7D32;
      --sun: #F0B429;
      --copper: #D65A1F;
      --ink: #1C2A33;
      --paper: #F7FAFC;
      --card: #FFFFFF;
      --muted: #5A6B76;
      --line: #D5E2EA;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      min-height: 100%;
    }
    body { padding-bottom: calc(72px + var(--safe-bottom)); }
    header.app-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(120deg, var(--sky-deep), var(--sky));
      color: #fff;
      padding: 14px 16px 12px;
    }
    header.app-bar .bar-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    header.app-bar h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    header.app-bar p {
      margin: 4px 0 0;
      opacity: 0.9;
      font-size: 0.82rem;
    }
    .header-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      font-size: 0.72rem;
      opacity: 0.95;
      max-width: 62%;
      text-align: right;
      line-height: 1.25;
    }
    .header-user {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }
    .header-user img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.45);
    }
    .header-user .user-name {
      font-weight: 700;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    a.header-logout {
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.66rem;
      font-weight: 800;
      white-space: nowrap;
    }
    a.header-logout:hover { background: rgba(255,255,255,0.14); }
    .header-version {
      font-family: ui-monospace, Consolas, monospace;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .deploy-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.18);
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .deploy-pill.ok { border-color: #86efac; color: #dcfce7; }
    .deploy-pill.active { border-color: #fde68a; color: #fef3c7; }
    .deploy-pill.ready { border-color: #67e8f9; color: #ecfeff; }
    .deploy-pill.error { border-color: #fca5a5; color: #fee2e2; }
    .deploy-pill.muted { opacity: 0.85; }
    .deploy-pill button {
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.18);
      color: #fff;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.66rem;
      font-weight: 800;
    }
    main { padding: 14px 14px 24px; max-width: 640px; margin: 0 auto; }
    .hidden { display: none !important; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
    }
    .stat b { display: block; font-size: 1.35rem; color: var(--sky-deep); }
    .stat span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .track, .course {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .course {
      border-width: 2px;
      border-color: #E5E5E5;
      box-shadow: 0 2px 0 #E5E5E5;
      position: relative;
      overflow: hidden;
    }
    .course::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 8px;
      background: var(--course-color, var(--sky));
    }
    .track .badge, .course .badge {
      flex: 0 0 auto;
      min-width: 52px;
      height: 44px;
      padding: 0 8px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #fff;
      background: var(--course-color, var(--sky));
      font-size: 0.68rem;
      text-align: center;
      line-height: 1.1;
    }
    .track.upload .badge, .course.upload .badge { background: var(--copper); }
    .track h2, .course h2 { margin: 0 0 4px; font-size: 1.05rem; }
    .track p, .course p { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .track .meta, .course .meta { margin-top: 8px; font-size: 0.8rem; color: var(--sky-deep); font-weight: 700; }
    .section-title {
      margin: 18px 0 10px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }
    .league-card {
      background: var(--card);
      border: 2px solid #E5E5E5;
      border-radius: 18px;
      box-shadow: 0 2px 0 #E5E5E5;
      padding: 14px;
      margin-bottom: 12px;
    }
    .league-xp {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .league-xp .xp-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF4D6;
      color: #C48A12;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 0.95rem;
    }
    .league-xp .week-pill {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      text-align: right;
    }
    .league-chart {
      width: 100%;
      height: auto;
      display: block;
      margin: 4px 0 8px;
    }
    .league-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin: 0 0 4px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
    }
    .league-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .league-legend i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .league-row {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-top: 1px solid var(--line);
    }
    .league-row:first-child { border-top: 0; }
    .league-row.you {
      background: #E8F8D8;
      margin: 0 -8px;
      padding: 8px;
      border-radius: 12px;
      border-top: 0;
    }
    .league-rank {
      font-weight: 800;
      color: var(--muted);
      text-align: center;
    }
    .league-name {
      font-weight: 800;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .league-name img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #E8F2F8;
    }
    .league-name .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--sky);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      font-weight: 800;
      flex: 0 0 auto;
    }
    .league-xp-count {
      font-weight: 800;
      color: #C48A12;
      white-space: nowrap;
    }
    .course-progress {
      margin-top: 8px;
      height: 10px;
      background: #E5E5E5;
      border-radius: 999px;
      overflow: hidden;
    }
    .course-progress > span {
      display: block;
      height: 100%;
      background: var(--course-color, var(--grass));
      border-radius: 999px;
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button, .btn {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: var(--sky-deep);
      color: #fff;
    }
    button.secondary, .btn.secondary { background: #E8F2F8; color: var(--sky-deep); }
    button.good { background: var(--grass); }
    button.hard { background: #C48A12; }
    button.again { background: var(--copper); }
    button.easy { background: #1F8A70; }
    button:disabled { opacity: 0.5; cursor: default; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      border-radius: 999px;
      padding: 8px 12px;
      background: #E8F2F8;
      color: var(--sky-deep);
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      border: 0;
      white-space: nowrap;
    }
    .chip.active { background: var(--sky-deep); color: #fff; }
    .hint {
      margin: -4px 0 12px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .flash {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 16px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
    }
    .flash .q {
      font-size: 1.15rem;
      font-weight: 700;
      flex: 1;
    }
    .flash .q u,
    .admin-q u,
    .edit-hint u {
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .flash .a {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--line);
      color: var(--ink);
      font-size: 1rem;
    }
    .flash .source {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .card-toolbar .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .card-toolbar .meta-remaining {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 700;
    }
    .topic-pill {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      padding: 3px 8px;
      border-radius: 999px;
      background: #E8F2F8;
      color: var(--sky-deep);
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .details-pill, .figure-pill {
      appearance: none;
      border: 1px solid #D7E4EE;
      background: #F4F9FC;
      color: var(--sky-deep);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 0;
    }
    .details-pill:active, .figure-pill:active { transform: scale(0.98); }
    .details-pill.has-details {
      background: #E8F8D8;
      border-color: #B7DFA3;
      color: #2F7D32;
    }
    .figure-pill.has-figure {
      background: #E8F2F8;
      border-color: #A9C7DD;
      color: var(--sky-deep);
    }
    .figure-pill:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .figure-image-wrap {
      margin: 0;
      border-radius: 12px;
      overflow: auto;
      background: #F7F9FB;
      border: 1px solid #E4ECF2;
      max-height: min(62vh, 520px);
      -webkit-overflow-scrolling: touch;
    }
    .figure-image-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }
    .figure-caption {
      margin: 10px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    /* Desktop/tablet: fit the whole figure in view (phone keeps width:100% + pinch zoom). */
    @media (min-width: 768px) {
      .details-sheet.figure-sheet {
        align-items: center;
        justify-items: center;
        padding: 24px;
      }
      .details-panel.figure-panel {
        width: min(960px, 96vw);
        max-height: min(92vh, 920px);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .details-panel.figure-panel header {
        flex: 0 0 auto;
      }
      .details-panel.figure-panel .figure-caption {
        flex: 0 0 auto;
      }
      .figure-image-wrap {
        flex: 1 1 auto;
        max-height: none;
        min-height: 0;
        overflow: auto;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .figure-image-wrap img {
        width: auto;
        max-width: 100%;
        max-height: min(78vh, 780px);
        height: auto;
        object-fit: contain;
      }
    }
    .details-sheet {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      align-items: end;
      background: rgba(20, 28, 36, 0.45);
      padding: 16px 12px calc(16px + var(--safe-bottom));
    }
    .details-panel {
      background: #fff;
      border-radius: 20px 20px 16px 16px;
      max-height: min(78vh, 640px);
      overflow: auto;
      padding: 16px 16px 18px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.18);
    }
    .details-panel header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .details-panel h3 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
    }
    .details-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }
    .details-edit-btn {
      border: 1px solid var(--line) !important;
      background: #E8F2F8 !important;
      color: var(--sky-deep) !important;
      border-radius: 999px !important;
      padding: 6px 12px !important;
      font-size: 0.78rem !important;
      font-weight: 800 !important;
    }
    .details-panel .close-details {
      appearance: none;
      border: 0;
      background: #F0F0F0;
      color: var(--ink);
      border-radius: 999px;
      width: 34px;
      height: 34px;
      font-weight: 800;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .details-summary {
      margin: 0 0 14px;
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--ink);
    }
    .details-links {
      display: grid;
      gap: 8px;
    }
    .details-links a {
      display: block;
      padding: 10px 12px;
      border-radius: 12px;
      background: #F4F9FC;
      border: 1px solid #D7E4EE;
      color: var(--sky-deep);
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      line-height: 1.3;
    }
    .details-empty {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }
    .details-edit-form label {
      display: block;
      margin-top: 2px;
    }
    .details-edit-form textarea {
      min-height: 140px;
      resize: vertical;
    }
    .details-link-edit {
      display: grid;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      background: #F8FBFD;
    }
    .details-link-edit input { margin: 0 0 4px; }
    .details-link-edit .link-edit-actions {
      display: flex;
      justify-content: flex-end;
    }
    .details-link-edit .link-edit-actions button {
      background: transparent;
      color: var(--copper);
      padding: 4px 8px;
      font-size: 0.78rem;
    }
    .details-edit-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .details-edit-actions button { flex: 1; }
    .grade-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .grade-row button { padding: 14px 6px; font-size: 0.85rem; }
    .study-nav-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }
    .study-nav-row button {
      padding: 10px 12px;
      font-size: 0.85rem;
      background: #E8F2F8;
      color: var(--sky-deep);
    }
    .study-nav-row button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .study-nav-row .study-nav-back { justify-self: start; }
    .study-nav-row .study-nav-next { justify-self: end; }
    .study-nav-pos {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
      background: #fff;
      border-top: 1px solid var(--line);
      padding: 8px 4px calc(8px + var(--safe-bottom));
    }
    .polar-chart {
      width: 100%;
      height: auto;
      background: #fafbfc;
      border: 1px solid var(--line);
      border-radius: 14px;
      display: block;
      margin: 8px 0 10px;
    }
    .polar-sliders {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 8px 0 4px;
    }
    .polar-sliders label {
      display: block;
      margin-bottom: 2px;
      font-size: 0.8rem;
    }
    .polar-sliders input[type="range"] {
      margin: 4px 0 0;
      padding: 0;
      border: none;
      background: transparent;
    }
    .polar-status {
      background: #E8F2F8;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.88rem;
      color: var(--ink);
      margin: 0 0 10px;
    }
    .polar-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 12px;
    }
    .polar-pill {
      flex: 1 1 calc(50% - 8px);
      min-width: 140px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .polar-pill .k {
      display: block;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .polar-pill .v {
      display: block;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--sky-deep);
      line-height: 1.2;
    }
    .polar-pill .r {
      display: block;
      margin-top: 2px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .polar-pill .r.up { color: var(--grass); }
    .polar-pill .r.down { color: var(--copper); }
    .polar-ref {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      margin-top: 8px;
      display: block;
      background: #fff;
    }
    .polar-docs details {
      margin: 8px 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      background: #fff;
    }
    .polar-docs summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--sky-deep);
      list-style: none;
    }
    .polar-docs summary::-webkit-details-marker { display: none; }
    .polar-docs summary::before {
      content: "▸ ";
      color: var(--muted);
    }
    .polar-docs details[open] summary::before { content: "▾ "; }
    .polar-doc-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .polar-doc-actions a {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--sky-deep);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      background: #f4f8fb;
    }
    .warn {
      background: #fff4e5;
      border: 1px solid #f0c36d;
      color: #7a4b00;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.88rem;
      margin: 8px 0 12px;
    }
    @media (max-width: 420px) {
      .polar-sliders { grid-template-columns: 1fr; }
    }
    .nav button {
      background: transparent;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 8px 4px;
      border-radius: 10px;
    }
    .nav button.active { color: var(--sky-deep); background: #E8F2F8; }
    .nav button span { display: block; font-size: 1.1rem; margin-bottom: 2px; }
    textarea, input, select {
      width: 100%;

<body>
  <header class="app-bar">
    <div class="bar-top">
      <div>
        <h1>FLF Glider Study</h1>
        <p id="subtitle">Commercial focus · SGS 2-33 · Common knowledge</p>
      </div>

        <span class="header-version" id="header-version">v…</span>
        <a class="header-logout hidden" id="header-logout" href="/logout">Logout</a>
        <span id="header-deploy" class="deploy-pill muted">Deploy …</span>
      </div>
    </div>
  </header>
  <main id="app"></main>
  <nav class="nav" id="nav">
    <button type="button" data-view="home"><span>⌂</span>Home</button>
    <button type="button" data-view="study"><span>✎</span>Study</button>
    <button type="button" data-view="aircraft"><span>✈</span>Aircraft</button>
    <button type="button" data-view="progress"><span>★</span>League</button>
    <button type="button" data-view="admin" id="navAdminBtn" class="nav-admin-hidden"><span>⚙</span>Admin</button>
  </nav>
  <div class="toast" id="toast"></div>
  <script src="/aircraft/polar-233.js"></script>
  <script>
    const state = {
      view: 'home',
      user: null,
      isAdmin: false,
      tracks: [],
      topics: [],
      stats: null,
      study: {
        track: 'commercial',
        topic: '',
        mode: 'due',
        limit: 20,
        grades: [],
        matched: 0,
        cards: [],
        index: 0,
        doneIds: new Set(),
        revealed: false,
        quizChoice: null,
        editing: false,
        editDraft: null,
        detailsOpen: false,
        detailsEditing: false,
        detailsDraft: null,
        figureOpen: false
      },
      imports: [],
      admin: {
        q: '',
        track: '',
        topic: '',
        hasFigure: false,
        topics: [],
        results: [],
        searched: false,
        status: 'Enter filters and tap Search.',
        searchTimer: null,
        users: [],
        usersStatus: '',
        schedule: {
          again: { value: 10, unit: 'minutes' },
          hard: { value: 1, unit: 'days' },
          good: { value: 7, unit: 'days' },
          easy: { value: 0, unit: 'never' }
        }
      },
      progressTracks: [],
      league: null,
      aircraft: {
        page: 'hub', // hub | sgs233
        config: 'dual',
        macCready: 2.0,
        wind: 0 // mph; +tail / −head
      }
    };

    const app = document.getElementById('app');
    const toastEl = document.getElementById('toast');
    let pageLoadDeploymentId = null;

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    async function api(path, opts) {
      const res = await fetch(path, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', ...(opts?.headers || {}) },
        ...opts
      });
      if (res.status === 401 && !String(path).startsWith('/auth/me')) {
        window.location.href = '/login?return=' + encodeURIComponent(window.location.pathname || '/');
        throw new Error('Authentication required');
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /** Escape text, but allow simple <u>...</u> underline markers. */
    function formatRichText(value) {
      const raw = String(value ?? '');
      const parts = raw.split(/(<\/?u>)/i);
      let open = false;
      let html = '';
      for (const part of parts) {
        if (/^<u>$/i.test(part)) {
          if (!open) {
            html += '<u>';
            open = true;
          }
          continue;
        }
        if (/^<\/u>$/i.test(part)) {
          if (open) {
            html += '</u>';
            open = false;
          }
          continue;
        }
        html += escapeHtml(part);
      }
      if (open) html += '</u>';
      return html;
    }

    function isAdminUser() {
      return Boolean(state.isAdmin);
    }

    async function loadAuthUser() {
      const el = document.getElementById('header-user');
      const logoutEl = document.getElementById('header-logout');
      if (!el) return;
      try {
        const me = await api('/auth/me');
        if (!me.authenticated || !me.user) {
          el.classList.add('hidden');
          if (logoutEl) logoutEl.classList.add('hidden');
          state.isAdmin = false;
          setNav();
          return;
        }
        const u = me.user;
        const avatar = u.picture
          ? `<img src="${escapeHtml(u.picture)}" alt="" referrerpolicy="no-referrer" />`
          : '';
        el.innerHTML = `${avatar}<span class="user-name" title="${escapeHtml(u.email)}">${escapeHtml(u.name || u.email)}</span>`;
        el.classList.remove('hidden');
        if (logoutEl) logoutEl.classList.remove('hidden');
        state.user = u;
        state.isAdmin = Boolean(u.isAdmin);
        if (!state.isAdmin && state.view === 'admin') state.view = 'home';
        setNav();
      } catch {
        el.classList.add('hidden');
        if (logoutEl) logoutEl.classList.add('hidden');
        // Auth disabled locally: treat as admin so the desk remains editable.
        try {
          const health = await fetch('/healthz').then((r) => r.json());
          state.isAdmin = !health.auth_enabled;
        } catch {
          state.isAdmin = false;
        }
        setNav();
      }
    }

    function formatHeaderVersion(meta) {
      if (!meta) return 'app';
      const commit = meta.git_commit ? (' · ' + meta.git_commit) : '';
      const env = meta.environment ? (' · ' + meta.environment) : '';
      return 'v' + (meta.version || '?') + commit + env;
    }

    function setDeployPill(ui, gitCommit) {
      const el = document.getElementById('header-deploy');
      if (!el || !ui) return;
      el.className = 'deploy-pill ' + (ui.tone || 'muted');
      if (ui.refresh_recommended) {
        el.innerHTML = '<span>' + (ui.label || 'New version ready') + '</span> <button type="button" data-deploy-refresh>Refresh</button>';
        const btn = el.querySelector('[data-deploy-refresh]');
        if (btn) btn.addEventListener('click', function () { window.location.reload(); });
        return;
      }
      const commit = gitCommit ? (' · ' + gitCommit) : '';
      el.textContent = (ui.label || 'Deploy') + commit;
    }

    async function pollDeployStatus() {
      const el = document.getElementById('header-deploy');
      if (!el) return;
      try {
        const query = pageLoadDeploymentId
          ? ('?page_load_deployment_id=' + encodeURIComponent(pageLoadDeploymentId))
          : '';
        const deploy = await api('/api/deploy-status' + query);
        if (!pageLoadDeploymentId && deploy.instance?.deployment_id) {
          pageLoadDeploymentId = deploy.instance.deployment_id;
        }
        setDeployPill(deploy.ui || {}, deploy.instance?.git_commit || null);
      } catch {
        el.className = 'deploy-pill active';
        el.textContent = 'Reconnecting…';
      }
    }

    async function loadHeaderMeta() {
      try {
        const [meta, deploy] = await Promise.all([
          api('/api/v1/app/meta'),
          api('/api/deploy-status')
        ]);
        const versionEl = document.getElementById('header-version');
        if (versionEl) versionEl.textContent = formatHeaderVersion(meta);
        if (!pageLoadDeploymentId && deploy.instance?.deployment_id) {
          pageLoadDeploymentId = deploy.instance.deployment_id;
        }
        setDeployPill(deploy.ui || {}, deploy.instance?.git_commit || meta.git_commit || null);
      } catch {
        const versionEl = document.getElementById('header-version');
        if (versionEl) versionEl.textContent = 'app';
      }
    }

    loadHeaderMeta();
    window.setInterval(pollDeployStatus, 15000);

    function trackLabel(id) {
      return ({
        common: 'Common',
        private: 'Private',
        commercial: 'Commercial',
        cfi_g: 'CFI-G',
        aircraft_233: '2-33'
      })[id] || id;
    }

    function courseColor(id) {
      return ({
        aircraft_233: '#58CC02',
        common: '#1CB0F6',
        commercial: '#FF9600',
        cfi_g: '#CE82FF',
        private: '#FF4B4B'
      })[id] || '#2B8FCC';
    }

    const LEAGUE_LINE_COLORS = ['#58CC02', '#1CB0F6', '#FF9600', '#CE82FF', '#FF4B4B', '#2F7D32'];

    function shortDayLabel(isoDate) {
      try {
        const [y, m, d] = String(isoDate).split('-').map(Number);
        const dt = new Date(Date.UTC(y, m - 1, d, 17, 0, 0));
        return new Intl.DateTimeFormat('en-US', { weekday: 'short', timeZone: 'America/Chicago' }).format(dt);
      } catch {
        return String(isoDate).slice(5);
      }
    }

    function leagueChartSvg(summary) {
      if (!summary?.dates?.length || !summary?.chart?.length) {
        return '<div class="empty" style="padding:16px">Answer a few questions to start the league chart.</div>';
      }
      const W = 320;
      const H = 160;
      const padL = 28;
      const padR = 10;
      const padT = 12;
      const padB = 28;
      const dates = summary.dates;
      const seriesList = summary.chart;
      const maxY = Math.max(5, ...seriesList.flatMap((p) => p.series || [0]));
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const xAt = (i) => padL + (dates.length <= 1 ? plotW / 2 : (i / (dates.length - 1)) * plotW);
      const yAt = (v) => padT + plotH - (v / maxY) * plotH;
      const grid = [0, 0.5, 1].map((t) => {
        const y = padT + plotH * (1 - t);
        const label = Math.round(maxY * t);
        return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#E5E5E5" stroke-width="1"/>
          <text x="${padL - 6}" y="${y + 3}" text-anchor="end" font-size="9" fill="#5A6B76">${label}</text>`;
      }).join('');
      const xLabels = dates.map((d, i) =>
        `<text x="${xAt(i)}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#5A6B76">${escapeHtml(shortDayLabel(d))}</text>`
      ).join('');
      const paths = seriesList.map((person, idx) => {
        const color = person.is_you ? '#58CC02' : LEAGUE_LINE_COLORS[(idx + 1) % LEAGUE_LINE_COLORS.length];
        const pts = (person.series || []).map((v, i) => `${xAt(i)},${yAt(v)}`).join(' ');
        const width = person.is_you ? 3.2 : 2;
        const dots = (person.series || []).map((v, i) =>
          `<circle cx="${xAt(i)}" cy="${yAt(v)}" r="${person.is_you ? 3.5 : 2.5}" fill="${color}" />`
        ).join('');
        return `<polyline fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" points="${pts}" />${dots}`;
      }).join('');
      return `<svg class="league-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Questions answered per day">${grid}${paths}${xLabels}</svg>`;
    }

    function leagueLegendHtml(summary) {
      if (!summary?.chart?.length) return '';
      return `<div class="league-legend">${summary.chart.map((p, idx) => {
        const color = p.is_you ? '#58CC02' : LEAGUE_LINE_COLORS[(idx + 1) % LEAGUE_LINE_COLORS.length];

        mode: state.study.mode,

      });

      const data = await api('/api/study?' + q.toString());
      state.study.cards = data.cards;
      state.study.matched = data.matched ?? data.cards.length;
      state.study.index = 0;
      state.study.doneIds = new Set();
      state.study.revealed = false;
      state.study.quizChoice = null;
      state.study.editing = false;

    async function openStudy(opts = {}) {
      state.view = 'study';
      if (opts.track) state.study.track = opts.track;
      if (opts.topic != null) state.study.topic = opts.topic;
      if (opts.mode) state.study.mode = opts.mode;
      if (opts.limit != null) state.study.limit = opts.limit;
      if (opts.grades) state.study.grades = opts.grades.slice();

    async function openStudyCard(card) {
      if (!card?.id || !card.track_id) return;
      state.view = 'study';
      state.study.track = card.track_id;
      state.study.topic = card.topic_id || '';
      state.study.mode = 'all';
      state.study.grades = [];
      state.study.revealed = false;
      state.study.quizChoice = null;
      state.study.editing = false;
      state.study.editDraft = null;
      state.study.detailsOpen = false;
      state.study.detailsEditing = false;
      state.study.detailsDraft = null;
      state.study.figureOpen = false;
      state.topics = (await api('/api/topics?track=' + encodeURIComponent(card.track_id))).topics;
      const q = new URLSearchParams({
        track: card.track_id,
        mode: 'all',
        limit: '200'
      });
      if (card.topic_id) q.set('topic', card.topic_id);
      const data = await api('/api/study?' + q.toString());
      let cards = data.cards || [];
      let idx = cards.findIndex((c) => c.id === card.id);
      if (idx < 0) {
        cards = [{ ...card, progress: null }, ...cards];
        idx = 0;
      }
      state.study.cards = cards;
      state.study.matched = data.matched ?? cards.length;
      state.study.index = idx;
      state.study.doneIds = new Set();
      render();
    }

    function choiceIsCorrect(card, choice) {
      if (!card || choice == null) return null;
      const norm = (s) => String(s ?? '').trim().replace(/[.?!,;:]+$/g, '').replace(/\s+/g, ' ').toLowerCase();
      return norm(choice) === norm(card.answer);
    }

    function findNextIncomplete(fromIndex) {
      const cards = state.study.cards;
      const done = state.study.doneIds || new Set();
      for (let i = Math.max(0, fromIndex); i < cards.length; i++) {
        if (cards[i] && !done.has(cards[i].id)) return i;
      }
      return -1;
    }

    async function grade(g) {
      const card = state.study.cards[state.study.index];
      if (!card) return;
      const hasChoices = Array.isArray(card.choices) && card.choices.length;
      const choice = hasChoices ? state.study.quizChoice : null;
      const correct = hasChoices
        ? choiceIsCorrect(card, choice) === true
        : g !== 'again';
      const result = await api('/api/study/' + encodeURIComponent(card.id), {
        method: 'POST',
        body: JSON.stringify({
          grade: g,
          choice: choice || undefined,
          correct
        })
      });
      // Keep graded cards in the session list so Back can return to them.
      if (!state.study.doneIds) state.study.doneIds = new Set();
      state.study.doneIds.add(card.id);
      state.study.revealed = false;
      state.study.quizChoice = null;
      state.study.editing = false;
      state.study.editDraft = null;
      state.study.detailsOpen = false;
      state.study.detailsEditing = false;
      state.study.detailsDraft = null;
      state.study.figureOpen = false;
      const nextIncomplete = findNextIncomplete(state.study.index + 1);
      if (nextIncomplete >= 0) {
        state.study.index = nextIncomplete;
      } else {
        const wrap = findNextIncomplete(0);
        if (wrap >= 0) state.study.index = wrap;
      }
      if (state.stats && result?.activity?.answers != null) {
        state.stats.today_xp = result.activity.answers;
      }
      if (state.league?.you && result?.activity?.answers != null) {
        const prevToday = state.league.you.today || 0;
        const nextToday = result.activity.answers;
        const delta = Math.max(0, nextToday - prevToday);
        state.league.you.today = nextToday;
        state.league.you.week_total = (state.league.you.week_total || 0) + delta;
        if (Array.isArray(state.league.you.series) && state.league.you.series.length) {
          state.league.you.series[state.league.you.series.length - 1] = nextToday;
        }
      }
      const xp = result?.xp ?? (correct ? 2 : 1);
      toast(`${g.toUpperCase()} · +${xp} XP`);
      render();
    }

    function currentCard() {
      return state.study.cards[state.study.index] || null;
    }

    function resetStudyCardUi() {
      state.study.revealed = false;
      state.study.quizChoice = null;
      state.study.editing = false;
      state.study.editDraft = null;
      state.study.detailsOpen = false;
      state.study.detailsEditing = false;
      state.study.detailsDraft = null;
      state.study.figureOpen = false;
    }

    function moveStudy(delta) {
      const next = state.study.index + delta;
      if (next < 0 || next >= state.study.cards.length) return;
      state.study.index = next;
      resetStudyCardUi();
      render();
    }

    function beginEditCard() {
      if (!isAdminUser()) return;
      const card = currentCard();
      if (!card) return;
      const choices = Array.isArray(card.choices) ? card.choices.slice() : [];
      state.study.editing = true;
      state.study.editDraft = {
        question: card.question || '',
        answer: card.answer || '',
        choices,
        correctIndex: choices.findIndex((c) => c === card.answer)
      };
      render();
    }

    function cancelEditCard() {
      state.study.editing = false;
      state.study.editDraft = null;
      render();
    }

    function readEditDraftFromDom() {
      const draft = state.study.editDraft;
      if (!draft) return null;
      const question = app.querySelector('#editQuestion')?.value ?? draft.question;
      const answerField = app.querySelector('#editAnswer')?.value;
      const choiceEls = [...app.querySelectorAll('[data-edit-choice]')];
      const choices = choiceEls.map((el) => el.value);
      const checked = app.querySelector('input[name="editCorrect"]:checked');
      let correctIndex = checked ? Number(checked.value) : draft.correctIndex;
      if (!Number.isFinite(correctIndex)) correctIndex = -1;
      let answer = String(answerField ?? draft.answer ?? '').trim();
      if (choices.length && correctIndex >= 0 && choices[correctIndex]?.trim()) {
        answer = choices[correctIndex].trim();
      }
      return {
        question: String(question || '').trim(),
        answer,
        choices: choices.map((c) => String(c || '').trim()).filter(Boolean),
        correctIndex
      };
    }

    async function saveEditCard() {
      const card = currentCard();
      if (!card) return;
      const draft = readEditDraftFromDom();
      if (!draft) return;
      if (!draft.question) {
        toast('Question is required');
        return;
      }
      if (draft.choices.length && draft.correctIndex < 0) {
        toast('Select the correct choice');
        return;
      }
      if (!draft.answer) {
        toast('Answer is required');
        return;
      }
      try {
        const body = {
          question: draft.question,
          answer: draft.answer,
          choices: draft.choices.length ? draft.choices : null
        };
        const result = await api('/api/cards/' + encodeURIComponent(card.id), {
          method: 'PATCH',
          body: JSON.stringify(body)
        });
        Object.assign(card, result.card);
        state.study.editing = false;
        state.study.editDraft = null;
        state.study.revealed = false;
        state.study.quizChoice = null;
        toast('Card saved');
        render();
      } catch (err) {
        toast(err.message || 'Save failed');
      }
    }

        answer: card.answer || '',

      if (card.topic_title) return card.topic_title;
      return String(card.topic_id).replace(/^[^_]+_/, '').replace(/_/g, ' ');

    async function saveDetailsEdit() {
      const card = currentCard();
      if (!card) return;
      const draft = readDetailsDraftFromDom();
      if (!draft) return;
      const links = draft.links
        .map((l) => ({
          label: String(l.label || '').trim(),
          url: String(l.url || '').trim()
        }))
        .filter((l) => l.label || l.url);
      for (const link of links) {
        if (!link.label || !/^https?:\/\//i.test(link.url)) {
          toast('Each link needs a label and an http(s) URL');
          return;
        }
      }
      const summary = String(draft.summary || '').trim();
      if (!summary && !links.length) {
        toast('Add a summary and/or at least one link');
        return;
      }
      try {
        const result = await api('/api/cards/' + encodeURIComponent(card.id), {
          method: 'PATCH',
          body: JSON.stringify({ details: { summary, links } })
        });
        Object.assign(card, result.card);
        const adminHit = (state.admin.results || []).find((c) => c.id === card.id);
        if (adminHit) Object.assign(adminHit, result.card);
        state.study.detailsEditing = false;
        state.study.detailsDraft = null;
        toast('Details saved');
        render();
      } catch (err) {
        toast(err.message || 'Save failed');
      }
    }

      const summary = String(details?.summary || '').trim();

      const draft = state.study.detailsDraft || {
        summary,
        links: links.length ? links : [{ label: '', url: '' }]
      };
      return `
        <div class="details-sheet" id="detailsSheet" role="dialog" aria-modal="true" aria-label="Question details">

    function macCreadySvg(result) {
      const W = 360;
      const H = 312;
      const pad = { l: 42, r: 14, t: 18, b: 68 };
      const plotW = W - pad.l - pad.r;
      const plotH = H - pad.t - pad.b;
      const xMin = 0;
      const xMax = 90;
      const yMin = -6;
      const yMax = 4;
      const xOf = (mph) => pad.l + ((mph - xMin) / (xMax - xMin)) * plotW;
      const yOf = (vsKt) => pad.t + (1 - (vsKt - yMin) / (yMax - yMin)) * plotH;
      const zeroY = yOf(0);
      const tickY = pad.t + plotH + 14;
      const axisTitleY = tickY + 14;
      const legendY = axisTitleY + 16;

      const polarPts = (result.polar_gs || []).filter((p) => p.x_mph >= 0 && p.x_mph <= xMax + 2);
      const polarPath = Sgs233Polar.polarToBezierPath(
        polarPts,
        (p) => xOf(p.x_mph),
        (p) => yOf(p.vs_kt)
      );

      const colPolar = '#2563eb';
      const colTangent = '#E6B800';
      const colLd = '#16a34a';
      const colSink = '#7c3aed';

      let tangentLayer = '';
      if (result.ok && result.tangent) {
        const t = result.tangent;
        const mc = result.mac_cready_kt;
        // Extend tangent in chart space: Y knots vs X mph (display geometry)
        const xTouch = t.gs_mph;
        const yTouch = t.vs_kt;
        const slopeChart = (yTouch - mc) / Math.max(0.1, xTouch);
        const xEnd = xMax;
        const yEnd = mc + slopeChart * xEnd;
        const sinkY = yOf(t.vs_kt);
        const stfX = xOf(xTouch);
        const ldNum = fmt(t.ld, 1);
        const sinkNum = fmt(Math.abs(t.vs_kt), 2);
        tangentLayer = `
          <line x1="${xOf(0)}" y1="${yOf(mc)}" x2="${xOf(xEnd)}" y2="${yOf(yEnd)}" stroke="${colTangent}" stroke-width="2.5"/>
          <line x1="${pad.l}" y1="${sinkY}" x2="${pad.l + plotW}" y2="${sinkY}"
            stroke="${colSink}" stroke-width="1.5" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
          <text x="${pad.l + 4}" y="${sinkY - 4}" font-size="11" fill="${colSink}" font-weight="700">${sinkNum}</text>
          <line x1="${stfX}" y1="${pad.t}" x2="${stfX}" y2="${pad.t + plotH}"
            stroke="${colLd}" stroke-width="1.5" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
          <text x="${stfX + 4}" y="${pad.t + 12}" font-size="11" fill="${colLd}" font-weight="700">${ldNum}</text>
          <circle cx="${stfX}" cy="${sinkY}" r="5" fill="${colTangent}" stroke="#1C2A33" stroke-width="1.2"/>
          <text x="${stfX}" y="${zeroY + 14}" text-anchor="middle" font-size="11" fill="#1C2A33" font-weight="700">${Math.round(t.mph)}</text>
        `;
      }

      const xTicks = [0, 30, 42, 54, 66, 78, 90];
      const yTicks = [4, 2, 0, -2, -4, -6];
      const legendItems = [
        { label: 'Polar', color: colPolar, dashed: false, x: pad.l },
        { label: 'Tangent', color: colTangent, dashed: false, x: pad.l + 62 },
        { label: 'L/D', color: colLd, dashed: true, x: pad.l + 136 },
        { label: 'Sink', color: colSink, dashed: true, x: pad.l + 188 }
      ];
      const legend = `
        <g font-size="9" fill="#334155" font-weight="600">
          ${legendItems.map((item) => `
            <line x1="${item.x}" y1="${legendY}" x2="${item.x + 14}" y2="${legendY}"
              stroke="${item.color}" stroke-width="${item.dashed ? 1.5 : 2.5}"
              ${item.dashed ? 'stroke-dasharray="3 3"' : ''}/>
            <text x="${item.x + 18}" y="${legendY + 3}">${item.label}</text>
          `).join('')}
        </g>
      `;

      return `
        <svg class="polar-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="2-33 MacCready tangent construction">
          <rect x="0" y="0" width="${W}" height="${H}" fill="#fafbfc"/>
          <rect x="${pad.l}" y="${pad.t}" width="${plotW}" height="${plotH}" fill="#fff" stroke="#cbd5e1"/>
          ${xTicks.map((v) => `<line x1="${xOf(v)}" y1="${pad.t}" x2="${xOf(v)}" y2="${pad.t + plotH}" stroke="#eef2f6"/><text x="${xOf(v)}" y="${tickY}" text-anchor="middle" font-size="10" fill="#64748b">${v}</text>`).join('')}
          ${yTicks.map((v) => `<line x1="${pad.l}" y1="${yOf(v)}" x2="${pad.l + plotW}" y2="${yOf(v)}" stroke="${v === 0 ? '#94a3b8' : '#eef2f6'}" stroke-width="${v === 0 ? 1.4 : 1}"/><text x="${pad.l - 6}" y="${yOf(v) + 3}" text-anchor="end" font-size="10" fill="#64748b">${v}</text>`).join('')}
          <path d="${polarPath}" fill="none" stroke="${colPolar}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          ${tangentLayer}
          <text x="${W / 2}" y="${axisTitleY}" text-anchor="middle" font-size="11" fill="#334155">Indicated airspeed (mph)</text>
          ${legend}
          <text x="14" y="${pad.t + plotH / 2}" text-anchor="middle" font-size="11" fill="#334155" transform="rotate(-90 14 ${pad.t + plotH / 2})">Vertical speed (knots)</text>
        </svg>
      `;
    }

    function relativeClass(pct, betterWhenHigher) {
      if (pct == null || Number.isNaN(pct)) return '';
      const delta = pct - 100;
      if (Math.abs(delta) < 1.5) return '';
      const better = betterWhenHigher ? delta > 0 : delta < 0;
      return better ? 'up' : 'down';
    }

    function relativeText(pct, label) {
      if (pct == null || Number.isNaN(pct)) return '';
      const delta = pct - 100;
      const sign = delta >= 0 ? '+' : '';
      return `${sign}${fmt(delta, 0)}% vs ${label}`;
    }

    function polarPillsHtml(result) {
      if (!result.ok || !result.metrics) {
        return `<div class="polar-pills" id="polarPills"></div>`;
      }
      const m = result.metrics;
      const airRel = relativeText(m.air_ld_vs_best_pct, 'best L/D');
      const gndRel = relativeText(m.ground_ld_vs_best_pct, 'best L/D');
      const sinkRel = relativeText(m.sink_vs_min_pct, 'min sink');
      const stfDelta = m.delta_stf_mph;
      const stfRel = Math.abs(stfDelta) < 0.4
        ? 'same as calm STF'
        : `${stfDelta > 0 ? '+' : ''}${fmt(stfDelta, 0)} mph vs calm STF`;
      return `
        <div class="polar-pills" id="polarPills">
          <div class="polar-pill">
            <span class="k">L/D</span>
            <span class="v" id="pillAirLd">${fmt(m.air_ld, 1)}:1</span>
            <span class="r ${relativeClass(m.air_ld_vs_best_pct, true)}" id="pillAirLdRel">${airRel}</span>
          </div>
          <div class="polar-pill">
            <span class="k">Ground L/D (wind)</span>
            <span class="v" id="pillGndLd">${fmt(m.ground_ld, 1)}:1</span>
            <span class="r ${relativeClass(m.ground_ld_vs_best_pct, true)}" id="pillGndLdRel">${gndRel}</span>
          </div>
          <div class="polar-pill">
            <span class="k">Sink rate at STF</span>
            <span class="v" id="pillSink">${fmt(m.sink_kt, 2)} kt</span>
            <span class="r ${relativeClass(m.sink_vs_min_pct, false)}" id="pillSinkRel">${fmt(m.sink_fpm, 0)} fpm · ${sinkRel}</span>
          </div>
          <div class="polar-pill">
            <span class="k">Speed to fly</span>
            <span class="v" id="pillStf">${Math.round(result.tangent.mph)} mph</span>
            <span class="r" id="pillStfRel">${stfRel}</span>
          </div>
        </div>
      `;
    }

    function updatePolarPills(result) {
      const host = document.getElementById('polarPills');
      if (!host) return;
      host.outerHTML = polarPillsHtml(result);
    }

    function renderAircraft233() {
      const polar = typeof Sgs233Polar !== 'undefined' ? Sgs233Polar : null;
      if (!polar) {
        return `<div class="empty">Polar module failed to load.</div>`;
      }
      const result = polar.findMacCreadyTangent({
        config: state.aircraft.config,
        macCreadyKt: state.aircraft.macCready,
        windMph: state.aircraft.wind
      });
      const cfg = result.config || polar.getConfig(state.aircraft.config);
      const t = result.ok ? result.tangent : null;
      const status = result.ok
        ? `Tangent touches at <strong>${Math.round(t.mph)} mph</strong>: approximate still-air speed to fly.`
        : escapeHtml(result.error || 'No tangent');
      return `
        <div class="btn-row" style="margin-top:0">
          <button type="button" class="secondary" data-aircraft-page="hub">← Aircraft</button>
        </div>
        <h2 style="margin:10px 0 6px;font-size:1.15rem">2-33 MacCready tangent-line construction</h2>
        <div class="chip-row">
          <button type="button" class="chip ${state.aircraft.config === 'solo' ? 'active' : ''}" data-polar-config="solo">Solo ${cfg.key === 'solo' ? cfg.weight_lb : 790} lb</button>
          <button type="button" class="chip ${state.aircraft.config === 'dual' ? 'active' : ''}" data-polar-config="dual">Dual ${cfg.key === 'dual' ? cfg.weight_lb : 1040} lb</button>
        </div>
        <div class="polar-sliders">
          <div>
            <label>MacCready setting: <span id="mcLabel">${fmt(state.aircraft.macCready, 1)} kt</span></label>
            <input id="polarMc" type="range" min="0" max="6" step="0.1" value="${state.aircraft.macCready}" />
          </div>
          <div>
            <label>Wind: <span id="polarWindLabel">${Sgs233Polar.windLabel(state.aircraft.wind)}</span></label>
            <input id="polarWind" type="range" min="-30" max="30" step="1" value="${state.aircraft.wind}" />
          </div>
        </div>
        <div id="polarSvgWrap">${macCreadySvg(result)}</div>
        <div class="polar-status" id="polarStatus">${status}</div>
        ${polarPillsHtml(result)}
        <p style="font-size:0.78rem;color:var(--muted);margin:0 0 8px">
          ${escapeHtml(cfg.label)} ${cfg.weight_lb} lb · S=${cfg.wing_loading_psf} psf.
          Blue = smooth POH polar; yellow = MacCready tangent. Wind shifts polar on groundspeed axis.
        </p>
        <div class="polar-docs">
          <details>
            <summary>POH source polar chart</summary>
            <img class="polar-ref" src="/aircraft/sgs-233-polar.png" alt="SGS 2-33A calculated performance curves" />
            <div class="polar-doc-actions">
              <a href="/aircraft/sgs-233-polar.png" download="sgs-233-polar-chart.png">Download chart</a>
            </div>
          </details>
        </div>
      `;

    function updatePolarLive() {
      if (typeof Sgs233Polar === 'undefined') return;
      const result = Sgs233Polar.findMacCreadyTangent({
        config: state.aircraft.config,
        macCreadyKt: state.aircraft.macCready,
        windMph: state.aircraft.wind
      });
      const mcLabel = document.getElementById('mcLabel');
      const windLabel = document.getElementById('polarWindLabel');
      if (mcLabel) mcLabel.textContent = fmt(state.aircraft.macCready, 1) + ' kt';
      if (windLabel) windLabel.textContent = Sgs233Polar.windLabel(state.aircraft.wind);
      const status = document.getElementById('polarStatus');
      if (status) {
        if (result.ok) {
          const t = result.tangent;
          status.innerHTML = `Tangent touches at <strong>${Math.round(t.mph)} mph</strong>: approximate still-air speed to fly.`;
        } else {
          status.textContent = result.error || 'No tangent';
        }
      }
      const wrap = document.getElementById('polarSvgWrap');
      if (wrap) wrap.innerHTML = macCreadySvg(result);
      updatePolarPills(result);
    }

    async function loadProgress() {
      const [tracks, stats, byTrack, league] = await Promise.all([
        api('/api/courses').catch(() => api('/api/tracks')),
        api('/api/stats'),
        api('/api/progress-by-track'),
        api('/api/league?days=7').catch(() => null)
      ]);
      state.tracks = tracks.courses || tracks.tracks || [];
      state.stats = stats;
      state.progressTracks = byTrack.tracks || [];
      state.league = league;
      render();
    }

    function readinessRing(pct, radius, stroke, color) {
      const c = 2 * Math.PI * radius;
      const clamped = Math.max(0, Math.min(100, Number(pct) || 0));
      const dash = (clamped / 100) * c;
      return `
        <circle cx="44" cy="44" r="${radius}" fill="none" stroke="#E6E6E6" stroke-width="${stroke}" />
        <circle cx="44" cy="44" r="${radius}" fill="none" stroke="${color}" stroke-width="${stroke}"
          stroke-linecap="round"
          stroke-dasharray="${dash.toFixed(2)} ${(c - dash).toFixed(2)}"
          transform="rotate(-90 44 44)" />
      `;
    }

    function readinessStatusCopy(r) {
      if (!r || !(r.coverage_pct > 0 || r.accuracy_pct != null)) {
        return {
          headline: 'Not started',
          tip: 'Answer every card once, then hold an 80%+ score to reach Ready.'
        };
      }
      if (r.ready) {
        return {
          headline: 'Ready for checkride study',
          tip: 'Full deck seen and score is at least 80%.'
        };
      }
      if (r.blocker === 'coverage') {
        return {
          headline: `${r.readiness_pct}% ready`,
          tip: `Score looks solid (${r.accuracy_pct}%), but ${r.remaining} card${r.remaining === 1 ? '' : 's'} still unseen — readiness stays capped until the whole deck is done.`
        };
      }
      if (r.blocker === 'accuracy') {
        return {
          headline: `${r.readiness_pct}% ready`,
          tip: `Deck covered, but score is ${r.accuracy_pct}% — need ${r.accuracy_target}%+ to unlock Ready.`
        };
      }
      return {
        headline: `${r.readiness_pct}% ready`,
        tip: `Seen ${r.coverage_pct}% of cards · score ${r.accuracy_pct == null ? '—' : r.accuracy_pct + '%'}. Need full coverage and ${r.accuracy_target}%+ score.`
      };
    }

    function renderReadinessMeter(track) {
      const r = track.readiness || {
        coverage_pct: track.card_count > 0 ? Math.round((100 * track.studied) / track.card_count) : 0,
        accuracy_pct: null,
        accuracy_target: 80,
        readiness_pct: 0,
        ready: false,
        blocker: 'both',
        remaining: Math.max(0, (track.card_count || 0) - (track.studied || 0))
      };
      const color = courseColor(track.id);
      const accToward = r.accuracy_pct == null
        ? 0
        : Math.min(100, Math.round((100 * r.accuracy_pct) / (r.accuracy_target || 80)));
      const copy = readinessStatusCopy(r);
      const coverTone = r.coverage_pct >= 100 ? 'ok' : 'warn';
      const scoreTone = r.accuracy_pct != null && r.accuracy_pct >= (r.accuracy_target || 80) ? 'ok' : 'warn';
      return `
        <div class="readiness ${r.ready ? 'ready' : ''}" aria-label="Course readiness ${r.readiness_pct}%">
          <svg class="readiness-dial" viewBox="0 0 88 88" role="img" aria-hidden="true">
            ${readinessRing(r.coverage_pct, 36, 7, color)}
            ${readinessRing(accToward, 26, 7, r.accuracy_pct != null && r.accuracy_pct >= (r.accuracy_target || 80) ? '#58CC02' : '#C48A12')}
            <text x="44" y="42" text-anchor="middle" font-size="18" font-weight="800" fill="#1A1A1A">${r.readiness_pct}%</text>
            <text x="44" y="56" text-anchor="middle" font-size="8" font-weight="800" letter-spacing="0.06em" fill="${r.ready ? '#2F7D32' : '#777'}">${r.ready ? 'READY' : 'TO GO'}</text>
          </svg>
          <div class="readiness-body">
            <div class="readiness-label">Checkride readiness</div>
            <p class="readiness-status">${escapeHtml(copy.headline)}</p>
            <div class="readiness-chips">
              <div class="readiness-chip ${coverTone}" title="Unique cards answered at least once">
                <b>${r.coverage_pct}%</b><span>Seen</span>
              </div>
              <div class="readiness-chip ${scoreTone}" title="Last-answer correct rate on cards you have seen">
                <b>${r.accuracy_pct == null ? '—' : r.accuracy_pct + '%'}</b><span>Score</span>
              </div>
            </div>
            <p class="readiness-tip">${escapeHtml(copy.tip)}</p>
          </div>
        </div>
      `;
    }

    function renderProgress() {
      const s = state.stats || { cards: 0, studied: 0, due: 0, today_xp: 0 };
      const rows = state.progressTracks || [];
      return `
        <div class="stats">
          <div class="stat"><b>${s.today_xp ?? state.league?.you?.today ?? 0}</b><span>Today XP</span></div>
          <div class="stat"><b>${state.league?.you?.week_total ?? 0}</b><span>Week XP</span></div>
          <div class="stat"><b>${s.due}</b><span>Due</span></div>
        </div>
        <h2 class="section-title">League this week</h2>
        <p class="hint">Correct answers earn 2 XP; wrong answers earn 1 XP (Central Time). Chart shows you next to other signed-in learners.</p>

        <p class="hint">Readiness hits 100% only after every card is answered and course score is 80%+. Outer ring = seen; inner ring = score toward 80%. Tap a grade pill to study those cards.</p>
        ${rows.length ? rows.map((t) => {
          const color = courseColor(t.id);
          const topicRows = (t.topics || []).filter((topic) => (topic.answers_total || 0) > 0);
          return `
          <article class="course ${t.status === 'upload_later' ? 'upload' : ''}" style="--course-color:${color}">
            <div class="badge">${trackLabel(t.id)}</div>
            <div style="flex:1">
              <h2>${escapeHtml(t.title)}</h2>
              <div class="progress-meta">
                ${t.card_count} cards · ${t.studied} studied · ${t.new} new · ${t.due} due
              </div>
              ${renderReadinessMeter(t)}
              <div class="grade-pills">
                <button type="button" class="grade-pill again" data-open-grade-study="${t.id}" data-filter-grade="again" ${!(t.again > 0) ? 'disabled' : ''}><b>${t.again || 0}</b><span>Again</span></button>
                <button type="button" class="grade-pill hard" data-open-grade-study="${t.id}" data-filter-grade="hard" ${!(t.hard > 0) ? 'disabled' : ''}><b>${t.hard || 0}</b><span>Hard</span></button>
                <button type="button" class="grade-pill good" data-open-grade-study="${t.id}" data-filter-grade="good" ${!(t.good > 0) ? 'disabled' : ''}><b>${t.good || 0}</b><span>Good</span></button>
                <button type="button" class="grade-pill easy" data-open-grade-study="${t.id}" data-filter-grade="easy" ${!(t.easy > 0) ? 'disabled' : ''}><b>${t.easy || 0}</b><span>Easy</span></button>
              </div>
              <div class="topic-accuracy">
                <div class="topic-accuracy-title">Correct by topic</div>
                ${topicRows.length ? topicRows.map((topic) => {
                  const correctPct = topic.correct_pct == null ? 0 : topic.correct_pct;
                  const tone = correctPct >= 80 ? 'hi' : correctPct >= 50 ? 'mid' : 'lo';
                  return `
                    <div class="topic-accuracy-row" title="${topic.answers_correct || 0} correct of ${topic.answers_total || 0} answers">
                      <div class="topic-accuracy-name">${escapeHtml(topic.title)}</div>
                      <div class="topic-accuracy-meta">
                        <div class="topic-accuracy-bar" aria-hidden="true"><span style="width:${correctPct}%"></span></div>
                        <span class="topic-accuracy-pct ${tone}">${correctPct}%</span>
                      </div>
                    </div>`;
                }).join('') : '<div class="topic-accuracy-empty">No answers in this course yet.</div>'}
              </div>
              <div class="btn-row">
                <button type="button" data-open-study="${t.id}" ${!(t.card_count > 0) ? 'disabled' : ''}>Continue</button>
              </div>
            </div>
          </article>`;
        }).join('') : '<div class="empty">No courses yet.</div>'}
      `;
    }

    function adminTopicTitle(card) {
      if (!card?.topic_id) return 'Topic';
      const match = (state.admin.topics || []).find((t) => t.id === card.topic_id)
        || (state.topics || []).find((t) => t.id === card.topic_id);
      if (match?.title) return match.title;
      return String(card.topic_id).replace(/^[^_]+_/, '').replace(/_/g, ' ');
    }

    function renderAdminSearchResults() {
      const a = state.admin;
      if (!a.searched) {
        return `<div class="empty">${escapeHtml(a.status || 'Enter filters and tap Search.')}</div>`;
      }
      const rows = a.results || [];
      if (!rows.length) {
        return `<div class="empty">${escapeHtml(a.status || 'No matching questions.')}</div>`;
      }
      return rows.map((card) => `
        <button type="button" class="admin-result" data-open-card="${escapeHtml(card.id)}" title="Open in Study">
          <div class="badge" style="background:${courseColor(card.track_id)}">${trackLabel(card.track_id)}</div>
          <div style="flex:1;min-width:0">
            <div class="admin-result-meta">
              <span class="admin-pill">${escapeHtml(adminTopicTitle(card))}</span>
              ${card.figure ? '<span class="admin-pill fig">Figure</span>' : ''}
            </div>
            <p class="admin-q">${formatRichText(card.question || '')}</p>
            <p class="admin-a">${escapeHtml(card.answer || '')}</p>
          </div>
        </button>
      `).join('');
    }

    function formatAdminWhen(value) {
      if (!value) return '';
      try {
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return '';
        return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
      } catch {
        return '';
      }
    }

    function renderAdminUsers() {
      const users = state.admin.users || [];
      if (!users.length) {
        return `<div class="empty">${escapeHtml(state.admin.usersStatus || 'No signed-in users yet.')}</div>`;
      }
      return `<div class="admin-user-list">${users.map((u) => {
        const sub = escapeHtml(u.google_sub || '');
        const name = escapeHtml(u.name || u.email || 'User');
        const email = escapeHtml(u.email || '');
        const last = formatAdminWhen(u.last_login_at);
        const avatar = u.picture
          ? `<img src="${escapeHtml(u.picture)}" alt="" referrerpolicy="no-referrer" />`
          : `<span class="admin-user-avatar">${escapeHtml((u.name || u.email || '?').slice(0, 1).toUpperCase())}</span>`;
        const self = state.user?.sub && state.user.sub === u.google_sub;
        return `
          <div class="admin-user-row">
            ${avatar}
            <div class="admin-user-meta">
              <strong>${name}${self ? ' (you)' : ''}</strong>
              <span>${email}${last ? ` · last login ${escapeHtml(last)}` : ''}</span>
            </div>
            <label class="admin-user-check">
              <input type="checkbox" data-admin-user="${sub}" ${u.is_admin ? 'checked' : ''} ${self ? 'disabled' : ''} />
              Admin
            </label>
          </div>`;
      }).join('')}</div>`;
    }

      const a = state.admin;
      const courseOpts = [
        ['', 'All courses'],
        ...(state.tracks || []).map((t) => [t.id, t.title || trackLabel(t.id)])
