<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A6FA3" />
  <title>FLF Glider Study</title>
  <style>
    :root {
      --sky: #2B8FCC;
      --sky-deep: #1A6FA3;
      --grass: #2F7D32;
      --sun: #F0B429;
      --copper: #D65A1F;
      --ink: #1C2A33;
      --paper: #F7FAFC;
      --card: #FFFFFF;
      --muted: #5A6B76;
      --line: #D5E2EA;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      min-height: 100%;
    }
    body { padding-bottom: calc(72px + var(--safe-bottom)); }
    header.app-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(120deg, var(--sky-deep), var(--sky));
      color: #fff;
      padding: 14px 16px 12px;
    }
    header.app-bar .bar-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    header.app-bar h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    header.app-bar p {
      margin: 4px 0 0;
      opacity: 0.9;
      font-size: 0.82rem;
    }
    .header-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      font-size: 0.72rem;
      opacity: 0.95;
      max-width: 62%;
      text-align: right;
      line-height: 1.25;
    }
    .header-user {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }
    .header-user img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.45);
    }
    .header-user .user-name {
      font-weight: 700;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    a.header-logout {
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.66rem;
      font-weight: 800;
      white-space: nowrap;
    }
    a.header-logout:hover { background: rgba(255,255,255,0.14); }
    .header-version {
      font-family: ui-monospace, Consolas, monospace;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .deploy-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.18);
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .deploy-pill.ok { border-color: #86efac; color: #dcfce7; }
    .deploy-pill.active { border-color: #fde68a; color: #fef3c7; }
    .deploy-pill.ready { border-color: #67e8f9; color: #ecfeff; }
    .deploy-pill.error { border-color: #fca5a5; color: #fee2e2; }
    .deploy-pill.muted { opacity: 0.85; }
    .deploy-pill button {
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.18);
      color: #fff;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.66rem;
      font-weight: 800;
    }
    main { padding: 14px 14px 24px; max-width: 640px; margin: 0 auto; }
    .hidden { display: none !important; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
    }
    .stat b { display: block; font-size: 1.35rem; color: var(--sky-deep); }
    .stat span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .track {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .track .badge {
      flex: 0 0 auto;
      min-width: 52px;
      height: 44px;
      padding: 0 8px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #fff;
      background: var(--sky);
      font-size: 0.68rem;
      text-align: center;
      line-height: 1.1;
    }
    .track.upload .badge { background: var(--copper); }
    .track h2 { margin: 0 0 4px; font-size: 1.05rem; }
    .track p { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .track .meta { margin-top: 8px; font-size: 0.8rem; color: var(--sky-deep); font-weight: 700; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button, .btn {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: var(--sky-deep);
      color: #fff;
    }
    button.secondary, .btn.secondary { background: #E8F2F8; color: var(--sky-deep); }
    button.good { background: var(--grass); }
    button.hard { background: #C48A12; }
    button.again { background: var(--copper); }
    button.easy { background: #1F8A70; }
    button:disabled { opacity: 0.5; cursor: default; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      border-radius: 999px;
      padding: 8px 12px;
      background: #E8F2F8;
      color: var(--sky-deep);
      font-size: 0.8rem;
      font-weight: 700;
      border: 0;
      white-space: nowrap;
    }
    .chip.active { background: var(--sky-deep); color: #fff; }
    .hint {
      margin: -4px 0 12px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .flash {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 16px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
    }
    .flash .q {
      font-size: 1.15rem;
      font-weight: 700;
      flex: 1;
    }
    .flash .a {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--line);
      color: var(--ink);
      font-size: 1rem;
    }
    .flash .source {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .grade-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .grade-row button { padding: 14px 6px; font-size: 0.85rem; }
    .nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
      background: #fff;
      border-top: 1px solid var(--line);
      padding: 8px 4px calc(8px + var(--safe-bottom));
    }
    .polar-chart {
      width: 100%;
      height: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      display: block;
      margin: 10px 0 12px;
    }
    .polar-metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 10px 0 14px;
    }
    .polar-metrics .stat b { font-size: 1.15rem; }
    .polar-metrics .stat.wide { grid-column: 1 / -1; }
    .polar-ref {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      margin-top: 8px;
      display: block;
    }
    .wind-zero {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: -4px 0 12px;
    }
    .wind-zero button { padding: 8px 12px; font-size: 0.8rem; }
    .warn {
      background: #fff4e5;
      border: 1px solid #f0c36d;
      color: #7a4b00;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.88rem;
      margin: 8px 0 12px;
    }
    .nav button {
      background: transparent;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 8px 4px;
      border-radius: 10px;
    }
    .nav button.active { color: var(--sky-deep); background: #E8F2F8; }
    .nav button span { display: block; font-size: 1.1rem; margin-bottom: 2px; }
    textarea, input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      background: #fff;
      margin: 6px 0 12px;
    }
    label { font-size: 0.85rem; font-weight: 700; color: var(--muted); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(84px + var(--safe-bottom));
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 40;
      max-width: 90%;
    }
    .toast.show { opacity: 1; }
    .empty {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
    }
    .choices { display: grid; gap: 8px; margin-top: 14px; }
    .choices button {
      text-align: left;
      background: #E8F2F8;
      color: var(--ink);
    }
    .choices button.correct { background: #d7f0d9; }
    .choices button.wrong { background: #f8d9d0; }
  </style>
</head>
<body>
  <header class="app-bar">
    <div class="bar-top">
      <div>
        <h1>FLF Glider Study</h1>
        <p id="subtitle">Commercial focus · SGS 2-33 · Common knowledge</p>
      </div>
      <div class="header-meta" id="app-header-meta">
        <span class="header-user hidden" id="header-user"></span>
        <span class="header-version" id="header-version">v…</span>
        <a class="header-logout hidden" id="header-logout" href="/logout">Logout</a>
        <span id="header-deploy" class="deploy-pill muted">Deploy …</span>
      </div>
    </div>
  </header>
  <main id="app"></main>
  <nav class="nav" id="nav">
    <button type="button" data-view="home"><span>⌂</span>Home</button>
    <button type="button" data-view="study"><span>✎</span>Study</button>
    <button type="button" data-view="aircraft"><span>✈</span>Aircraft</button>
    <button type="button" data-view="progress"><span>▣</span>Progress</button>
    <button type="button" data-view="import"><span>↑</span>Import</button>
  </nav>
  <div class="toast" id="toast"></div>
  <script src="/aircraft/polar-233.js"></script>
  <script>
    const state = {
      view: 'home',
      tracks: [],
      topics: [],
      stats: null,
      study: {
        track: 'commercial',
        topic: '',
        mode: 'due',
        cards: [],
        index: 0,
        revealed: false,
        quizChoice: null
      },
      imports: [],
      aircraft: {
        page: 'hub', // hub | sgs233
        config: 'dual',
        airspeed: 54,
        wind: 0
      }
    };

    const app = document.getElementById('app');
    const toastEl = document.getElementById('toast');
    let pageLoadDeploymentId = null;

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    async function api(path, opts) {
      const res = await fetch(path, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', ...(opts?.headers || {}) },
        ...opts
      });
      if (res.status === 401 && !String(path).startsWith('/auth/me')) {
        window.location.href = '/login?return=' + encodeURIComponent(window.location.pathname || '/');
        throw new Error('Authentication required');
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadAuthUser() {
      const el = document.getElementById('header-user');
      const logoutEl = document.getElementById('header-logout');
      if (!el) return;
      try {
        const me = await api('/auth/me');
        if (!me.authenticated || !me.user) {
          el.classList.add('hidden');
          if (logoutEl) logoutEl.classList.add('hidden');
          return;
        }
        const u = me.user;
        const avatar = u.picture
          ? `<img src="${escapeHtml(u.picture)}" alt="" referrerpolicy="no-referrer" />`
          : '';
        el.innerHTML = `${avatar}<span class="user-name" title="${escapeHtml(u.email)}">${escapeHtml(u.name || u.email)}</span>`;
        el.classList.remove('hidden');
        if (logoutEl) logoutEl.classList.remove('hidden');
        state.user = u;
      } catch {
        el.classList.add('hidden');
        if (logoutEl) logoutEl.classList.add('hidden');
      }
    }

    function formatHeaderVersion(meta) {
      if (!meta) return 'app';
      const commit = meta.git_commit ? (' · ' + meta.git_commit) : '';
      const env = meta.environment ? (' · ' + meta.environment) : '';
      return 'v' + (meta.version || '?') + commit + env;
    }

    function setDeployPill(ui, gitCommit) {
      const el = document.getElementById('header-deploy');
      if (!el || !ui) return;
      el.className = 'deploy-pill ' + (ui.tone || 'muted');
      if (ui.refresh_recommended) {
        el.innerHTML = '<span>' + (ui.label || 'New version ready') + '</span> <button type="button" data-deploy-refresh>Refresh</button>';
        const btn = el.querySelector('[data-deploy-refresh]');
        if (btn) btn.addEventListener('click', function () { window.location.reload(); });
        return;
      }
      const commit = gitCommit ? (' · ' + gitCommit) : '';
      el.textContent = (ui.label || 'Deploy') + commit;
    }

    async function pollDeployStatus() {
      const el = document.getElementById('header-deploy');
      if (!el) return;
      try {
        const query = pageLoadDeploymentId
          ? ('?page_load_deployment_id=' + encodeURIComponent(pageLoadDeploymentId))
          : '';
        const deploy = await api('/api/deploy-status' + query);
        if (!pageLoadDeploymentId && deploy.instance?.deployment_id) {
          pageLoadDeploymentId = deploy.instance.deployment_id;
        }
        setDeployPill(deploy.ui || {}, deploy.instance?.git_commit || null);
      } catch {
        el.className = 'deploy-pill active';
        el.textContent = 'Reconnecting…';
      }
    }

    async function loadHeaderMeta() {
      try {
        const [meta, deploy] = await Promise.all([
          api('/api/v1/app/meta'),
          api('/api/deploy-status')
        ]);
        const versionEl = document.getElementById('header-version');
        if (versionEl) versionEl.textContent = formatHeaderVersion(meta);
        if (!pageLoadDeploymentId && deploy.instance?.deployment_id) {
          pageLoadDeploymentId = deploy.instance.deployment_id;
        }
        setDeployPill(deploy.ui || {}, deploy.instance?.git_commit || meta.git_commit || null);
      } catch {
        const versionEl = document.getElementById('header-version');
        if (versionEl) versionEl.textContent = 'app';
      }
    }

    loadAuthUser();
    loadHeaderMeta();
    window.setInterval(pollDeployStatus, 15000);

    function trackLabel(id) {
      return ({
        common: 'Common Knowledge',
        private: 'Private Glider',
        commercial: 'Commercial',
        cfi_g: 'CFI-G',
        aircraft_233: 'SGS 2-33'
      })[id] || id;
    }

    function setNav() {
      document.querySelectorAll('#nav button').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.view === state.view);
      });
    }

    async function loadHome() {
      const [tracks, stats] = await Promise.all([
        api('/api/tracks'),
        api('/api/stats')
      ]);
      state.tracks = tracks.tracks;
      state.stats = stats;
      render();
    }

    async function loadStudyDeck() {
      const q = new URLSearchParams({
        track: state.study.track,
        mode: state.study.mode
      });
      if (state.study.topic) q.set('topic', state.study.topic);
      const data = await api('/api/study?' + q.toString());
      state.study.cards = data.cards;
      state.study.index = 0;
      state.study.revealed = false;
      state.study.quizChoice = null;
      render();
    }

    async function grade(g) {
      const card = state.study.cards[state.study.index];
      if (!card) return;
      await api('/api/study/' + encodeURIComponent(card.id), {
        method: 'POST',
        body: JSON.stringify({ grade: g })
      });
      state.study.cards.splice(state.study.index, 1);
      state.study.revealed = false;
      state.study.quizChoice = null;
      if (state.study.index >= state.study.cards.length) state.study.index = 0;
      toast(g.toUpperCase());
      render();
    }

    function currentCard() {
      return state.study.cards[state.study.index] || null;
    }

    function renderHome() {
      const s = state.stats || { cards: 0, studied: 0, due: 0 };
      return `
        <div class="stats">
          <div class="stat"><b>${s.cards}</b><span>Cards</span></div>
          <div class="stat"><b>${s.studied}</b><span>Studied</span></div>
          <div class="stat"><b>${s.due}</b><span>Due</span></div>
        </div>
        <p style="color:var(--muted);font-size:0.9rem;margin:0 0 12px">
          Self-study now: <strong>Commercial</strong> + Common Knowledge + SGS 2-33.
          Upload CFI-G Q&amp;A next, Private Glider last.
        </p>
        ${state.tracks.map((t) => `
          <article class="track ${t.status === 'upload_later' ? 'upload' : ''}">
            <div class="badge">${trackLabel(t.id)}</div>
            <div style="flex:1">
              <h2>${escapeHtml(t.title)}</h2>
              <p>${escapeHtml(t.description || '')}</p>
              <div class="meta">${t.card_count || 0} cards · ${t.status === 'upload_later' ? 'upload later' : 'ready'}</div>
              <div class="btn-row">
                <button type="button" data-open-study="${t.id}" ${!(t.card_count > 0) ? 'disabled' : ''}>Study</button>
                ${t.status === 'upload_later' ? '<button type="button" class="secondary" data-view-jump="import">Import Q&amp;A</button>' : ''}
              </div>
            </div>
          </article>
        `).join('')}
      `;
    }

    function renderStudy() {
      const card = currentCard();
      const topics = state.topics.filter((t) => t.track_id === state.study.track);
      return `
        <div class="chip-row">
          ${['commercial','common','aircraft_233','cfi_g','private'].map((id) => `
            <button type="button" class="chip ${state.study.track === id ? 'active' : ''}" data-set-track="${id}">${trackLabel(id)}</button>
          `).join('')}
        </div>
        <div class="chip-row">
          <button type="button" class="chip ${state.study.mode === 'due' ? 'active' : ''}" data-set-mode="due">Due &amp; new</button>
          <button type="button" class="chip ${state.study.mode === 'all' ? 'active' : ''}" data-set-mode="all">All cards</button>
          <button type="button" class="chip ${state.study.mode === 'weak' ? 'active' : ''}" data-set-mode="weak">Weak cards</button>
        </div>
        <p class="hint">${
          state.study.mode === 'due'
            ? 'Due &amp; new: cards you have never studied, plus cards whose review date is today or overdue.'
            : state.study.mode === 'weak'
              ? 'Weak cards: ones you marked Again often or that have a low ease score.'
              : 'All cards: every card in this category, ignoring review schedule.'
        }</p>
        <label>Topic</label>
        <select id="topicSelect">
          <option value="">All topics</option>
          ${topics.map((t) => `<option value="${t.id}" ${state.study.topic === t.id ? 'selected' : ''}>${escapeHtml(t.title)}</option>`).join('')}
        </select>
        ${!card ? `<div class="empty">No cards in this deck filter. Try All, another track, or Import.</div>` : `
          <div class="flash">
            <div style="font-size:0.78rem;color:var(--muted);margin-bottom:8px">
              ${state.study.index + 1} remaining in session · ${escapeHtml(card.topic_id || '')}
            </div>
            <div class="q">${escapeHtml(card.question)}</div>
            ${Array.isArray(card.choices) && card.choices.length ? `
              <div class="choices">
                ${card.choices.map((c) => {
                  let cls = '';
                  if (state.study.revealed) {
                    if (c === card.answer) cls = 'correct';
                    else if (state.study.quizChoice === c) cls = 'wrong';
                  }
                  return `<button type="button" data-choice-label="${escapeHtml(c)}" class="${cls}" ${state.study.revealed ? 'disabled' : ''}>${escapeHtml(c)}</button>`;
                }).join('')}
              </div>
            ` : (!state.study.revealed
              ? `<div class="btn-row"><button type="button" id="revealBtn">Show answer</button></div>`
              : '')}
            ${state.study.revealed ? `
              ${!(Array.isArray(card.choices) && card.choices.length) ? `<div class="a">${escapeHtml(card.answer)}</div>` : ''}
              <div class="source">${escapeHtml(card.source || '')}</div>
              <div class="grade-row">
                <button type="button" class="again" data-grade="again">Again</button>
                <button type="button" class="hard" data-grade="hard">Hard</button>
                <button type="button" class="good" data-grade="good">Good</button>
                <button type="button" class="easy" data-grade="easy">Easy</button>
              </div>
            ` : ''}
          </div>
        `}
      `;
    }

    function fmt(n, digits = 1) {
      if (n == null || Number.isNaN(n)) return '—';
      return Number(n).toFixed(digits);
    }

    function renderAircraftHub() {
      return `
        <p style="color:var(--muted);font-size:0.9rem;margin:0 0 12px">
          Aircraft performance tools for club ships. Start with the Schweizer <strong>SGS 2-33</strong> polar.
        </p>
        <article class="track">
          <div class="badge">2-33</div>
          <div style="flex:1">
            <h2>SGS 2-33</h2>
            <p>Calculated performance polar (solo / dual) with live headwind &amp; tailwind glide ratio.</p>
            <div class="btn-row">
              <button type="button" data-aircraft-page="sgs233">Open polar</button>
              <button type="button" class="secondary" data-open-study="aircraft_233">Study cards</button>
            </div>
          </div>
        </article>
      `;
    }

    function polarSvg(result) {
      const W = 320;
      const H = 220;
      const pad = { l: 36, r: 16, t: 16, b: 28 };
      const plotW = W - pad.l - pad.r;
      const plotH = H - pad.t - pad.b;
      const pts = result.polar_points || [];
      const windCurve = (typeof Sgs233Polar !== 'undefined')
        ? Sgs233Polar.sampleGroundLdCurve(state.aircraft.config, state.aircraft.wind, 2)
        : [];
      const mphMin = 30;
      const mphMax = 90;
      const ldMin = 0;
      const ldMax = 26;
      const x = (mph) => pad.l + ((mph - mphMin) / (mphMax - mphMin)) * plotW;
      const y = (ld) => pad.t + (1 - (ld - ldMin) / (ldMax - ldMin)) * plotH;
      const airPath = pts.map((p, i) => `${i ? 'L' : 'M'} ${x(p.mph).toFixed(1)} ${y(p.ld).toFixed(1)}`).join(' ');
      const gndPath = windCurve.map((p, i) => `${i ? 'L' : 'M'} ${x(p.mph).toFixed(1)} ${y(p.ground_ld).toFixed(1)}`).join(' ');
      const markX = x(result.airspeed_mph);
      const markY = result.ground_ld != null ? y(result.ground_ld) : y(result.air_ld);
      return `
        <svg class="polar-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="SGS 2-33 L/D polar">
          <rect x="${pad.l}" y="${pad.t}" width="${plotW}" height="${plotH}" fill="#f7fafc" stroke="#d5e2ea"/>
          ${[40,50,60,70,80,90].map((m) => `<line x1="${x(m)}" y1="${pad.t}" x2="${x(m)}" y2="${pad.t+plotH}" stroke="#e8eef3"/><text x="${x(m)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#5a6b76">${m}</text>`).join('')}
          ${[5,10,15,20,25].map((ld) => `<line x1="${pad.l}" y1="${y(ld)}" x2="${pad.l+plotW}" y2="${y(ld)}" stroke="#e8eef3"/><text x="${pad.l-4}" y="${y(ld)+3}" text-anchor="end" font-size="9" fill="#5a6b76">${ld}</text>`).join('')}
          <path d="${airPath}" fill="none" stroke="#1A6FA3" stroke-width="2.5"/>
          ${gndPath ? `<path d="${gndPath}" fill="none" stroke="#D65A1F" stroke-width="2" stroke-dasharray="5 3"/>` : ''}
          <circle cx="${markX}" cy="${markY}" r="5" fill="#2F7D32" stroke="#fff" stroke-width="2"/>
          <text x="${pad.l}" y="12" font-size="10" fill="#1A6FA3" font-weight="700">Air L/D</text>
          <text x="${pad.l + 58}" y="12" font-size="10" fill="#D65A1F" font-weight="700">Ground L/D (wind)</text>
          <text x="${W/2}" y="${H-1}" text-anchor="middle" font-size="9" fill="#5a6b76">Airspeed (mph)</text>
        </svg>
      `;
    }

    function renderAircraft233() {
      const polar = typeof Sgs233Polar !== 'undefined' ? Sgs233Polar : null;
      if (!polar) {
        return `<div class="empty">Polar module failed to load.</div>`;
      }
      const result = polar.evaluate({
        config: state.aircraft.config,
        airspeedMph: state.aircraft.airspeed,
        windMph: state.aircraft.wind
      });
      const cfg = result.config;
      return `
        <div class="btn-row" style="margin-top:0">
          <button type="button" class="secondary" data-aircraft-page="hub">← Aircraft</button>
        </div>
        <h2 style="margin:10px 0 4px;font-size:1.15rem">SGS 2-33 polar</h2>
        <p style="margin:0 0 10px;color:var(--muted);font-size:0.88rem">
          ${escapeHtml(cfg.label)} ${cfg.weight_lb} lb · S=${cfg.wing_loading_psf} psf · digitized from SFM performance curves.
        </p>
        <div class="chip-row">
          <button type="button" class="chip ${state.aircraft.config === 'solo' ? 'active' : ''}" data-polar-config="solo">Solo 790 lb</button>
          <button type="button" class="chip ${state.aircraft.config === 'dual' ? 'active' : ''}" data-polar-config="dual">Dual 1040 lb</button>
        </div>
        <label>Airspeed <span id="polarAsLabel">${state.aircraft.airspeed}</span> mph</label>
        <input id="polarAirspeed" type="range" min="${cfg.points[0].mph}" max="${cfg.points[cfg.points.length-1].mph}" step="1" value="${state.aircraft.airspeed}" />
        <label>Wind <span id="polarWindLabel">${state.aircraft.wind === 0 ? 'calm' : (state.aircraft.wind > 0 ? state.aircraft.wind + ' mph tail' : Math.abs(state.aircraft.wind) + ' mph head')}</span></label>
        <input id="polarWind" type="range" min="-40" max="40" step="1" value="${state.aircraft.wind}" />
        <div class="wind-zero">
          <button type="button" class="secondary" id="polarWindCalm">Calm</button>
          <button type="button" class="secondary" id="polarBestLd">Best air L/D</button>
        </div>
        <div id="polarWarn">${!result.can_penetrate ? '<div class="warn">Groundspeed ≤ 0 — cannot penetrate this headwind at the selected airspeed. Fly faster or reduce headwind.</div>' : ''}</div>
        <div class="polar-metrics" id="polarMetrics">
          <div class="stat"><b id="mAirLd">${fmt(result.air_ld, 1)}</b><span>Air L/D</span></div>
          <div class="stat"><b id="mGndLd">${result.ground_ld == null ? '—' : fmt(result.ground_ld, 1)}</b><span>Ground L/D</span></div>
          <div class="stat"><b id="mSink">${fmt(result.sink_fps, 1)}</b><span>Sink ft/sec</span></div>
          <div class="stat"><b id="mGs">${fmt(result.groundspeed_mph, 0)}</b><span>GS mph</span></div>
          <div class="stat wide"><b id="mGlide">${result.glide_nm_per_1000 == null ? '—' : fmt(result.glide_nm_per_1000, 2) + ' NM'}</b><span>Glide per 1,000 ft (with wind)</span></div>
        </div>
        <div id="polarSvgWrap">${polarSvg(result)}</div>
        <p style="font-size:0.78rem;color:var(--muted);margin:0 0 8px">
          Best published air L/D on this curve ≈ <strong>${fmt(result.best_ld.ld, 1)}:1</strong> at <strong>${result.best_ld.mph} mph</strong>.
          Ground L/D = groundspeed ÷ sink. Headwind reduces range; tailwind increases it.
        </p>
        <details>
          <summary style="cursor:pointer;font-weight:700;color:var(--sky-deep)">Source polar chart</summary>
          <img class="polar-ref" src="/aircraft/sgs-233-polar.png" alt="SGS 2-33A calculated performance curves" />
        </details>
      `;
    }

    function updatePolarLive() {
      if (typeof Sgs233Polar === 'undefined') return;
      const result = Sgs233Polar.evaluate({
        config: state.aircraft.config,
        airspeedMph: state.aircraft.airspeed,
        windMph: state.aircraft.wind
      });
      const asLabel = document.getElementById('polarAsLabel');
      const windLabel = document.getElementById('polarWindLabel');
      if (asLabel) asLabel.textContent = String(state.aircraft.airspeed);
      if (windLabel) {
        windLabel.textContent = state.aircraft.wind === 0
          ? 'calm'
          : (state.aircraft.wind > 0
            ? state.aircraft.wind + ' mph tail'
            : Math.abs(state.aircraft.wind) + ' mph head');
      }
      const set = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      };
      set('mAirLd', fmt(result.air_ld, 1));
      set('mGndLd', result.ground_ld == null ? '—' : fmt(result.ground_ld, 1));
      set('mSink', fmt(result.sink_fps, 1));
      set('mGs', fmt(result.groundspeed_mph, 0));
      set('mGlide', result.glide_nm_per_1000 == null ? '—' : fmt(result.glide_nm_per_1000, 2) + ' NM');
      const warn = document.getElementById('polarWarn');
      if (warn) {
        warn.innerHTML = !result.can_penetrate
          ? '<div class="warn">Groundspeed ≤ 0 — cannot penetrate this headwind at the selected airspeed. Fly faster or reduce headwind.</div>'
          : '';
      }
      const wrap = document.getElementById('polarSvgWrap');
      if (wrap) wrap.innerHTML = polarSvg(result);
    }

    function renderProgress() {
      const s = state.stats || { cards: 0, studied: 0, due: 0 };
      return `
        <div class="stats">
          <div class="stat"><b>${s.cards}</b><span>Cards</span></div>
          <div class="stat"><b>${s.studied}</b><span>Studied</span></div>
          <div class="stat"><b>${s.due}</b><span>Due</span></div>
        </div>
        <article class="track">
          <div class="badge">SRS</div>
          <div>
            <h2>Spaced repetition</h2>
            <p>Again / Hard / Good / Easy updates due dates. Progress is saved to <strong>your signed-in Google account</strong> in shared Postgres.</p>
            <div class="btn-row">
              <button type="button" data-open-study="commercial">Study commercial due</button>
            </div>
          </div>
        </article>
        <article class="track">
          <div class="badge" style="background:var(--copper)">↑</div>
          <div>
            <h2>Upload plan</h2>
            <p>1) Keep drilling Commercial + 2-33 + Common.<br>
               2) Import CFI-G FOI / Q&amp;A when you start that study.<br>
               3) Import Private Q&amp;A last.</p>
          </div>
        </article>
      `;
    }

    function renderImport() {
      return `
        <p style="color:var(--muted);font-size:0.9rem">
          Upload CSV (<code>question,answer</code> or <code>topic,question,answer</code>) or paste JSON cards.
          Set track to <strong>cfi_g</strong> next, then <strong>private</strong>.
        </p>
        <label>Track</label>
        <select id="importTrack">
          <option value="cfi_g">CFI-G</option>
          <option value="private">Private</option>
          <option value="commercial">Commercial</option>
          <option value="common">Common</option>
          <option value="aircraft_233">Schweizer 2-33</option>
        </select>
        <label>Topic title</label>
        <input id="importTopic" placeholder="e.g. FOI — Levels of learning" />
        <label>Import password (if configured on Railway)</label>
        <input id="importPassword" type="password" placeholder="GLIDER_IMPORT_PASSWORD" autocomplete="off" />
        <label>CSV</label>
        <textarea id="importCsv" rows="8" placeholder="topic,question,answer&#10;FOI,What are the four levels of learning?,Rote Understanding Application Correlation"></textarea>
        <div class="btn-row">
          <button type="button" id="importBtn">Import deck</button>
        </div>
        <h2 style="font-size:1rem;margin:18px 0 8px">Recent imports</h2>
        ${(state.imports || []).length ? state.imports.map((imp) => `
          <div class="track"><div class="badge">${trackLabel(imp.track_id)}</div>
            <div><h2 style="font-size:0.95rem">${escapeHtml(imp.filename || 'upload')}</h2>
            <p>${imp.card_count} cards · ${escapeHtml(imp.created_at || '')}</p></div></div>
        `).join('') : '<div class="empty">No imports yet</div>'}
      `;
    }

    function render() {
      setNav();
      const sub = document.getElementById('subtitle');
      if (state.view === 'home') sub.textContent = 'Pick a track · Commercial is ready';
      if (state.view === 'study') sub.textContent = `Studying ${state.study.track} · ${state.study.cards.length} in session`;
      if (state.view === 'aircraft') {
        sub.textContent = state.aircraft.page === 'sgs233'
          ? 'SGS 2-33 · polar + wind'
          : 'Aircraft performance';
      }
      if (state.view === 'progress') sub.textContent = 'Your spaced-repetition progress';
      if (state.view === 'import') sub.textContent = 'Upload CFI-G then Private Q&A';

      if (state.view === 'home') app.innerHTML = renderHome();
      else if (state.view === 'study') app.innerHTML = renderStudy();
      else if (state.view === 'aircraft') {
        app.innerHTML = state.aircraft.page === 'sgs233' ? renderAircraft233() : renderAircraftHub();
      }
      else if (state.view === 'progress') app.innerHTML = renderProgress();
      else if (state.view === 'import') app.innerHTML = renderImport();

      bind();
    }

    function bind() {
      app.querySelectorAll('[data-open-study]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.view = 'study';
          state.study.track = btn.dataset.openStudy;
          state.study.topic = '';
          state.topics = (await api('/api/topics?track=' + encodeURIComponent(state.study.track))).topics;
          await loadStudyDeck();
        });
      });
      app.querySelectorAll('[data-view-jump]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.view = btn.dataset.viewJump;
          render();
        });
      });
      app.querySelectorAll('[data-aircraft-page]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.view = 'aircraft';
          state.aircraft.page = btn.dataset.aircraftPage;
          render();
        });
      });
      app.querySelectorAll('[data-polar-config]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.aircraft.config = btn.dataset.polarConfig;
          const cfg = Sgs233Polar.getConfig(state.aircraft.config);
          const min = cfg.points[0].mph;
          const max = cfg.points[cfg.points.length - 1].mph;
          state.aircraft.airspeed = Math.min(max, Math.max(min, state.aircraft.airspeed));
          render();
        });
      });
      const polarAirspeed = app.querySelector('#polarAirspeed');
      if (polarAirspeed) {
        polarAirspeed.addEventListener('input', () => {
          state.aircraft.airspeed = Number(polarAirspeed.value);
          updatePolarLive();
        });
      }
      const polarWind = app.querySelector('#polarWind');
      if (polarWind) {
        polarWind.addEventListener('input', () => {
          state.aircraft.wind = Number(polarWind.value);
          updatePolarLive();
        });
      }
      const calm = app.querySelector('#polarWindCalm');
      if (calm) {
        calm.addEventListener('click', () => {
          state.aircraft.wind = 0;
          const el = app.querySelector('#polarWind');
          if (el) el.value = '0';
          updatePolarLive();
        });
      }
      const best = app.querySelector('#polarBestLd');
      if (best) {
        best.addEventListener('click', () => {
          const r = Sgs233Polar.evaluate({
            config: state.aircraft.config,
            airspeedMph: state.aircraft.airspeed,
            windMph: state.aircraft.wind
          });
          state.aircraft.airspeed = r.best_ld.mph;
          const el = app.querySelector('#polarAirspeed');
          if (el) el.value = String(state.aircraft.airspeed);
          updatePolarLive();
        });
      }
      app.querySelectorAll('[data-set-track]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.study.track = btn.dataset.setTrack;
          state.study.topic = '';
          state.topics = (await api('/api/topics?track=' + encodeURIComponent(state.study.track))).topics;
          await loadStudyDeck();
        });
      });
      app.querySelectorAll('[data-set-mode]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.study.mode = btn.dataset.setMode;
          await loadStudyDeck();
        });
      });
      const topicSelect = app.querySelector('#topicSelect');
      if (topicSelect) {
        topicSelect.addEventListener('change', async () => {
          state.study.topic = topicSelect.value;
          await loadStudyDeck();
        });
      }
      const reveal = app.querySelector('#revealBtn');
      if (reveal) reveal.addEventListener('click', () => {
        state.study.revealed = true;
        render();
      });
      app.querySelectorAll('[data-choice-label]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (state.study.revealed) return;
          state.study.revealed = true;
          state.study.quizChoice = btn.getAttribute('data-choice-label');
          render();
        });
      });
      app.querySelectorAll('[data-grade]').forEach((btn) => {
        btn.addEventListener('click', () => grade(btn.dataset.grade));
      });
      const importBtn = app.querySelector('#importBtn');
      if (importBtn) {
        importBtn.addEventListener('click', async () => {
          try {
            const body = {
              track_id: app.querySelector('#importTrack').value,
              topic_title: app.querySelector('#importTopic').value || 'Imported deck',
              csv: app.querySelector('#importCsv').value,
              filename: 'paste.csv',
              password: app.querySelector('#importPassword').value
            };
            const result = await api('/api/import', {
              method: 'POST',
              body: JSON.stringify(body),
              headers: body.password ? { 'x-glider-import-password': body.password } : {}
            });
            toast(`Imported ${result.count} cards`);
            state.imports = (await api('/api/imports')).imports;
            await loadHome();
            state.view = 'import';
            render();
          } catch (err) {
            toast(err.message);
          }
        });
      }
    }

    document.getElementById('nav').addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-view]');
      if (!btn) return;
      state.view = btn.dataset.view;
      if (state.view === 'home' || state.view === 'progress') {
        await loadHome();
        return;
      }
      if (state.view === 'study') {
        state.topics = (await api('/api/topics?track=' + encodeURIComponent(state.study.track))).topics;
        await loadStudyDeck();
        return;
      }
      if (state.view === 'aircraft') {
        if (!state.aircraft.page) state.aircraft.page = 'hub';
        render();
        return;
      }
      if (state.view === 'import') {
        state.imports = (await api('/api/imports')).imports;
        render();
      }
    });

    loadHome().catch((err) => {
      app.innerHTML = `<div class="empty">Failed to load: ${escapeHtml(err.message)}</div>`;
    });
  </script>
</body>
</html>
